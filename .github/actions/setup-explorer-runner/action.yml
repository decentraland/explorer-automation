name: Set up Explorer test runner (macOS)
description: >-
  Install what `mf explorer test` needs on a GitHub-hosted macos-14 runner —
  .NET, AltTester Desktop, the allure CLI, MetaForge — and activate the
  AltTester license.

# Single definition of the runner chassis behind both Explorer suites. The
# Visual and InWorld workflows previously carried byte-identical copies of
# these four steps, so the .NET channel, the pinned AltTester build and the
# MetaForge installer URL could drift apart between the two suites without
# anyone noticing until one of them broke.
#
# macOS-only: the AltTester install goes through hdiutil / .dmg / /Applications
# and MetaForge's installer writes under ~/Library/Application Support. The
# Windows chassis (explorer-automation PR #12) needs a different set of steps
# and is deliberately not folded in here.
#
# Preconditions:
#   - The caller has already checked out decentraland/explorer-automation.
#     `uses: ./…` resolves against $GITHUB_WORKSPACE, so a workflow_call from
#     another repository reaches this file only because the calling workflow
#     checks this repo out explicitly. That also couples the action to the
#     checked-out ref: a caller pinning an old `tests_ref` gets that ref's
#     copy of this action, the same way it already gets that ref's
#     explorer/ci/* files.
#   - Composite actions cannot read the `secrets` context, so both credentials
#     arrive as inputs.
#
# Appends to $GITHUB_PATH — ~/.dotnet and MetaForge's bin dir. Those are
# visible to every later step of the caller, and to the steps of this action
# that follow the write, but not to the step that performs it.

inputs:
  github-token:
    description: 'PAT with read access to decentraland/MetaForge — REPOS_READ_ONLY_TOKEN.'
    required: true
  alttester-license:
    description: 'AltTester Pro license key — ALTTESTER_LICENSE.'
    required: true

runs:
  using: composite
  steps:
    - name: Install runtime prerequisites
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
        chmod +x /tmp/dotnet-install.sh
        /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
        echo "$HOME/.dotnet" >> "$GITHUB_PATH"
        export PATH="$HOME/.dotnet:$PATH"
        dotnet --version

        # AltTester Desktop ships as a zip wrapping a .dmg + sample build
        # Pipeline: download zip => extract dmg => mount => copy .app => eject
        ALTTESTER_URL="https://alttester.com/app/uploads/AltTester/desktop/AltTesterDesktopPackageMac__2_3_1.zip"
        curl -fsSL "$ALTTESTER_URL" -o /tmp/alttester.zip
        unzip -q /tmp/alttester.zip -d /tmp/alttester
        ALTTESTER_DMG=$(find /tmp/alttester -maxdepth 4 -name "AltTesterDesktop*.dmg" -type f | head -1)
        [ -n "$ALTTESTER_DMG" ] || { echo "::error::AltTesterDesktop dmg not found in zip"; exit 1; }
        hdiutil attach "$ALTTESTER_DMG" -nobrowse -quiet
        ALTTESTER_APP=$(find /Volumes -maxdepth 3 -name "AltTesterDesktop.app" -type d 2>/dev/null | head -1)
        [ -n "$ALTTESTER_APP" ] || { echo "::error::AltTesterDesktop.app not found under /Volumes after mount"; ls /Volumes; exit 1; }
        cp -R "$ALTTESTER_APP" /Applications/
        MOUNT_POINT=$(dirname "$ALTTESTER_APP")
        hdiutil detach "$MOUNT_POINT" -quiet || true
        xattr -dr com.apple.quarantine /Applications/AltTesterDesktop.app || true
        ls /Applications/AltTesterDesktop.app/Contents/MacOS/AltTesterDesktop

        # metaforge expects the "allure" npm package
        npm install -g allure --no-fund --no-audit --loglevel=error
        allure --version

        gh --version

    - name: Verify MetaForge access
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::error::Missing REPOS_READ_ONLY_TOKEN secret (PAT with read access to decentraland/MetaForge)"
          exit 1
        fi
        gh api repos/decentraland/MetaForge/releases/latest --jq '.tag_name'

    # install.sh installs the latest release. v2.15.0+ launches Explorer via
    # direct exec of Contents/MacOS/<binary> instead of /usr/bin/open, which is
    # what lets the InWorld suite's DYLD wrapper survive into the Explorer
    # process (LaunchServices strips DYLD_* at the SIP boundary).
    - name: Install MetaForge
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -eu
        SCRIPT=$(curl -fsSL https://explorer-artifacts.decentraland.zone/tools/install.sh)
        # The runner invokes this as `bash --noprofile --norc -e -o pipefail`,
        # so pipefail is on whether or not the script asks for it. `yes` stops
        # having a reader the moment the installer is done and reports
        # "yes: stdout: Broken pipe", which under pipefail makes a *successful*
        # install exit 141. Turn pipefail off across this one pipeline so its
        # status is the installer's; the inherited `-e` still fails the step
        # when the installer really fails.
        set +o pipefail
        yes | /bin/bash -c "$SCRIPT"
        set -o pipefail
        echo "$HOME/Library/Application Support/Decentraland/MetaForge/bin" >> "$GITHUB_PATH"

    - name: Configure AltTester license
      shell: bash
      env:
        ALTTESTER_LICENSE: ${{ inputs.alttester-license }}
      run: |
        set -euo pipefail
        if [ -z "${ALTTESTER_LICENSE:-}" ]; then
          echo "::error::Missing ALTTESTER_LICENSE secret. Add it under repo Settings → Secrets → Actions."
          exit 1
        fi
        mf alttester set-license "$ALTTESTER_LICENSE"
