name: InWorld Suite

# Reusable workflow that owns the mechanics of the InWorld NUnit suite on
# GitHub-hosted `macos-14`: prereq install, audio workarounds, AltTester
# license, Explorer install, `mf explorer test`, Allure upload, PR comment.
# Mirrors run-visual-suite.yml, which runs the same chassis.
#
# Callers:
#   - decentraland/explorer-automation → inworld-pr.yml, inworld-main.yml, and
#     manual workflow_dispatch
#   - decentraland/unity-explorer      → in-world-tests.yml, gating release and
#     hotfix PRs. A cross-repo caller supplies both artifacts and a tests_ref,
#     and gets neither for free: `build_url` is the macOS zip, the Windows leg
#     needs `windows_build_url`, and both legs check out this repo at
#     `tests_ref` because a bare checkout there would fetch the caller.
#
# Runs both platforms and reports them together:
#
#   run     macOS, GitHub-hosted macos-14, the whole selection on one runner
#   windows windows-inworld-custom-image.yml, the same selection split across
#           runners — that leg plans its own split, from `scope` when a caller
#           resolved one and from `filter` otherwise
#   report  one table over every leg, to the job summary and one PR comment
#
# The Windows leg stays its own file — the install steps (bash/brew/dmg against
# PowerShell/zip) and runner lifecycle (ephemeral GitHub-hosted against an
# autoscaled GPU pool) diverge too widely to share usefully — but it is called
# from here so a caller needs only one job, and the run shows only one fold.
#
# That nested `uses: ./…` resolves against this repo, so the Windows leg only
# reaches a same-repo caller. A cross-repo caller would need it passed by full
# ref — moot while the cross-repo path below stays unexercised.
#
# Required secrets (caller passes via `secrets: inherit`):
#   - ALTTESTER_LICENSE                    AltTester Pro license key
#   - REPOS_READ_ONLY_TOKEN                PAT — read on decentraland/MetaForge + decentraland/unity-explorer (the build-URL probe queries unity-explorer's Actions API)
#
# Required repository/environment variables for managed fixture infrastructure:
#   - E2E_FIXTURE_MANAGER_ROLE_ARN         IAM role assumed through GitHub OIDC
#   - E2E_FIXTURE_MANAGER_FUNCTION_NAME    Lambda function name or ARN
#
# The S3 upload credentials come in two org-level families, each granted to a
# different repo and pointing at a different bucket. `secrets: inherit` passes
# only what the caller was actually granted, and an ungranted secret resolves
# to an empty string rather than erroring — so this workflow selects the family
# by caller repo instead of hardcoding one (same table as run-visual-suite.yml):
#
#   caller repo                       secret family        bucket public URL
#   decentraland/unity-explorer       EXPLORER_TEAM_*      explorer-artifacts.decentraland.org
#   decentraland/explorer-automation  DEV_EXPLORER_TEAM_*  explorer-artifacts.decentraland.zone
#
# Each family carries S3_BUCKET, AWS_DEFAULT_REGION, AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY.
#
# IMAP_HOST/PORT/USER/PASSWORD, OTP_FROM_EMAIL and EMAIL_DOMAIN are consumed by
# the run step but are only needed when `filter` explicitly selects the Auth/OTP
# fixtures — the default Category=InWorld excludes them.
#
# Required vars on the caller's repo (`vars.*` inside a workflow_call run
# resolves against the caller's repo):
#   - <family>_S3_BUCKET_PUBLIC_URL  Public-facing prefix of the bucket
#
# Both *_S3_BUCKET_PUBLIC_URL vars are granted to both repos, so the var has to
# be picked from the same family as the bucket secret — mixing them uploads to
# one bucket and links to the other, and the report link 404s.

on:
  workflow_call:
    inputs:
      build_url:
        description: 'Direct URL to a Decentraland_macos.zip Explorer build.'
        type: string
        required: true
      filter:
        description: 'NUnit filter for `mf explorer test --filter`. Empty falls back to "Category=InWorld". Auth/OTP fixtures are excluded by that default — they need the email-OTP flow, unstable on macos-14; run them via an explicit filter.'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'PR number on the *caller* repo, used for the S3 path and the result comment. Empty → manual segment, summary-only.'
        type: string
        required: false
        default: ''
      tests_ref:
        description: 'explorer-automation ref for tests, explorer/ci files, and the .github/actions composite this workflow runs. Empty falls back to main. A ref predating that composite fails at runner level ("Can''t find ''action.yml''") before any of this workflow''s own diagnostics can report anything.'
        type: string
        required: false
        default: ''
      commit_sha:
        description: 'Short SHA of the caller PR head, surfaced in the PR comment + S3 path. Empty → run-<run_id>.'
        type: string
        required: false
        default: ''
      branch_label:
        description: 'Branch name shown in the PR comment. Empty → tests_ref or main.'
        type: string
        required: false
        default: ''
      record_perf:
        description: 'Record fixture-level perf samples (PerfSampler). Off by default: paravirt numbers are unreliable.'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Skip the mf explorer test invocation (chassis validation only).'
        type: boolean
        required: false
        default: false
      scope:
        description: 'What the Windows leg splits, in the scope resolver''s own words: `ALL` or `FIXTURES: A B C`. Empty is read from `filter` — the whole category splits, anything narrower runs on one Windows runner.'
        type: string
        required: false
        default: ''
      windows:
        description: 'Run the Windows leg alongside macOS.'
        type: boolean
        required: false
        default: true
      macos:
        description: 'Run the macOS leg.'
        type: boolean
        required: false
        default: true
      windows_build_url:
        description: >-
          Direct URL to a Decentraland_windows64.zip. Empty makes the Windows leg
          resolve the newest dev build on its own, which is fine for a run asking
          "is dev good" and wrong for one gating a specific commit — `build_url`
          alone only points the macOS leg at that commit.
        type: string
        required: false
        default: ''
      fixture_base_url:
        description: 'Optional reachable URL for offline E2E fixture infrastructure. Empty keeps the org environment.'
        type: string
        required: false
        default: ''
      provision_fixture:
        description: 'Provision ephemeral fixture infrastructure for this run. When false, keep the existing fixture behavior.'
        type: boolean
        required: false
        default: false
      fixture_mode:
        description: 'Fixture mode for compatibility: org, external, or local. Use provision_fixture to control the managed lifecycle.'
        type: string
        required: false
        default: 'org'
      fixture_base_domain:
        description: 'Optional fixture hostname. The Unity client receives it as --base-domain.'
        type: string
        required: false
        default: ''
      fixture_manager_role_arn:
        description: 'IAM role ARN assumed through GitHub Actions OIDC for the fixture manager.'
        type: string
        required: false
        default: ''
      fixture_manager_function:
        description: 'E2E fixture manager Lambda name or ARN.'
        type: string
        required: false
        default: ''
      fixture_manager_region:
        description: 'AWS region containing the fixture manager Lambda.'
        type: string
        required: false
        default: 'us-east-1'
      fixture_manager_profile:
        description: 'Fixture profile to provision through the manager Lambda.'
        type: string
        required: false
        default: 'core-v1'
      fixture_manager_ttl_minutes:
        description: 'Lease duration for the external fixture.'
        type: string
        required: false
        default: '90'
      fixture_seed_version:
        description: 'Immutable fixture seed version requested by the manager.'
        type: string
        required: false
        default: 'avatar-assets'
      fixture_image:
        description: 'Optional Catalyrst image started locally by the Windows runner.'
        type: string
        required: false
        default: ''
      fixture_ref:
        description: 'explorer-e2e-infra ref used when fixture_image is set.'
        type: string
        required: false
        default: 'main'
      fixture_canary:
        description: 'Enable fail-fast handling for fixture in-world bootstrap failures.'
        type: boolean
        required: false
        default: true
      real_livekit_smoke:
        description: 'Join a real LiveKit room during fixture preflight before launching Explorer.'
        type: boolean
        required: false
        default: false

  workflow_dispatch:
    inputs:
      build_url:
        description: 'Direct URL to a Decentraland_macos.zip. Empty = latest unity-explorer dev build.'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'PR number used for the result comment and artifact path.'
        type: string
        required: false
        default: ''
      tests_ref:
        description: 'explorer-automation ref used by the test checkout and CI helpers.'
        type: string
        required: false
        default: ''
      commit_sha:
        description: 'Commit label used in the result comment and artifact path.'
        type: string
        required: false
        default: ''
      filter:
        description: 'NUnit filter. Empty = Category=InWorld.'
        type: string
        required: false
        default: ''
      scope:
        description: 'Windows split scope: ALL or an explicit FIXTURES list.'
        type: string
        required: false
        default: ''
      record_perf:
        type: boolean
        required: false
        default: false
      dry_run:
        type: boolean
        required: false
        default: false
      windows:
        description: 'Run the Windows leg alongside macOS.'
        type: boolean
        required: false
        default: true
      macos:
        description: 'Run the macOS leg.'
        type: boolean
        required: false
        default: true
      windows_build_url:
        description: 'Direct URL to a Decentraland_windows64.zip. Empty = latest unity-explorer dev build.'
        type: string
        required: false
        default: ''
      fixture_base_url:
        description: 'Optional reachable URL for offline E2E fixture infrastructure.'
        type: string
        required: false
        default: ''
      fixture_canary:
        description: 'Enable fail-fast handling for fixture in-world bootstrap failures.'
        type: boolean
        required: false
        default: true
      real_livekit_smoke:
        description: 'Join a real LiveKit room during fixture preflight before launching Explorer.'
        type: boolean
        required: false
        default: false
      provision_fixture:
        description: 'Provision ephemeral fixture infrastructure for this run. When false, keep the existing fixture behavior.'
        type: boolean
        required: false
        default: false
      fixture_mode:
        description: 'Compatibility mode: org, external, or local. Use provision_fixture for the managed lifecycle.'
        type: choice
        options: [org, external, local]
        required: false
        default: org
      fixture_base_domain:
        description: 'Optional fixture hostname. The Unity client receives it as --base-domain.'
        type: string
        required: false
        default: ''
      fixture_manager_role_arn:
        description: 'IAM role ARN assumed through GitHub Actions OIDC for the fixture manager.'
        type: string
        required: false
        default: ''
      fixture_manager_function:
        description: 'E2E fixture manager Lambda name or ARN.'
        type: string
        required: false
        default: ''
      fixture_manager_region:
        description: 'AWS region containing the fixture manager Lambda.'
        type: string
        required: false
        default: 'us-east-1'
      fixture_manager_profile:
        description: 'Fixture profile to provision through the manager Lambda.'
        type: string
        required: false
        default: 'core-v1'
      fixture_manager_ttl_minutes:
        description: 'Lease duration for the external fixture.'
        type: string
        required: false
        default: '90'
      fixture_seed_version:
        description: 'Immutable fixture seed version requested by the manager.'
        type: string
        required: false
        default: 'avatar-assets'
      fixture_image:
        description: 'Optional Catalyrst image started locally by the Windows runner.'
        type: string
        required: false
        default: ''
      fixture_ref:
        description: 'explorer-e2e-infra ref used when fixture_image is set.'
        type: string
        required: false
        default: 'main'

# macos-14 runners are ephemeral, but serializing keeps concurrent runs for
# the same caller PR from racing on the S3 path. cancel-in-progress is safe:
# there is no persistent runner state to unwind.
#
# github.workflow gives each caller its own lane. Without it a manual dispatch
# and the main-branch run collide on ref+empty-pr_number and cancel each other.
concurrency:
  group: run-inworld-suite-${{ github.workflow }}-${{ github.ref }}-${{ inputs.pr_number || 'local' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # Fixture infrastructure is provisioned outside the macOS and Windows runners. The Windows
  # GPU image intentionally does not start Docker: GitHub's hosted pool does
  # not expose the nested virtualization required by Docker Desktop/WSL2.
  #
  # A caller can still pass fixture_base_url for a manually managed fixture.
  # In that case this job is skipped and the supplied URL is used unchanged.
  fixture:
    name: Provision fixture infrastructure
    # `fixture_mode=external` remains an implicit compatibility path for callers
    # that predate `provision_fixture`. New callers should use the explicit input.
    if: >-
      (inputs.provision_fixture || inputs.fixture_mode == 'external') &&
      inputs.fixture_base_url == ''
    runs-on: ubuntu-latest
    environment: e2e
    timeout-minutes: 15
    outputs:
      base_url: ${{ steps.provision.outputs.base_url }}
      base_domain: ${{ steps.provision.outputs.base_domain }}
      fixture_id: ${{ steps.provision.outputs.fixture_id }}
      seed: ${{ steps.provision.outputs.seed }}
    steps:
      - name: Check out automation helpers
        uses: actions/checkout@v6
        with:
          repository: decentraland/explorer-automation
          ref: ${{ inputs.tests_ref != '' && inputs.tests_ref || (github.repository == 'decentraland/explorer-automation' && github.sha || 'main') }}

      - name: Validate fixture manager configuration
        env:
          FIXTURE_MANAGER_ROLE_ARN: ${{ inputs.fixture_manager_role_arn }}
          FIXTURE_MANAGER_FUNCTION: ${{ inputs.fixture_manager_function }}
        run: |
          set -euo pipefail
          for name in FIXTURE_MANAGER_ROLE_ARN FIXTURE_MANAGER_FUNCTION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name must be configured for managed fixture provisioning"
              exit 1
            fi
          done

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.fixture_manager_role_arn }}
          aws-region: ${{ inputs.fixture_manager_region }}
          role-session-name: e2e-fixture-${{ github.run_id }}

      - name: Provision fixture infrastructure through manager Lambda
        id: provision
        env:
          E2E_FIXTURE_MANAGER_FUNCTION_NAME: ${{ inputs.fixture_manager_function }}
          AWS_REGION: ${{ inputs.fixture_manager_region }}
          FIXTURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          FIXTURE_PROFILE: ${{ inputs.fixture_manager_profile }}
          FIXTURE_TTL_MINUTES: ${{ inputs.fixture_manager_ttl_minutes }}
          FIXTURE_SEED_VERSION: ${{ inputs.fixture_seed_version }}
          FIXTURE_BASE_DOMAIN_INPUT: ${{ inputs.fixture_base_domain }}
        run: |
          set -euo pipefail

          for name in E2E_FIXTURE_MANAGER_FUNCTION_NAME FIXTURE_PROFILE \
                      FIXTURE_TTL_MINUTES FIXTURE_SEED_VERSION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name must be configured for managed fixture provisioning"
              exit 1
            fi
          done
          result="$(bash explorer/ci/invoke-fixture-manager.sh create)"
          endpoint="$(jq -r '.endpoint // empty' <<<"$result")"
          fixture_id="$(jq -r '.fixtureId // .runId // empty' <<<"$result")"
          seed="$(jq -r '.seedVersion // "unknown"' <<<"$result")"

          if [[ "$endpoint" != https://* ]]; then
            echo "::error::The manager Lambda returned '$endpoint'. Explorer E2E requires a trusted HTTPS edge with a hostname; direct HTTP task IPs are only a lifecycle smoke test."
            exit 1
          fi
          base_domain="${FIXTURE_BASE_DOMAIN_INPUT}"
          if [ -z "$base_domain" ]; then
            base_domain="$(python3 -c 'from urllib.parse import urlparse; import sys; print(urlparse(sys.argv[1]).hostname or "")' "$endpoint")"
          fi
          if [ -z "$base_domain" ]; then
            echo "::error::Could not derive fixture base domain from $endpoint"
            exit 1
          fi
          echo "base_url=$endpoint" >> "$GITHUB_OUTPUT"
          echo "base_domain=$base_domain" >> "$GITHUB_OUTPUT"
          echo "fixture_id=$fixture_id" >> "$GITHUB_OUTPUT"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          {
            echo "### Fixture infrastructure"
            echo
            echo "- Fixture: \`$fixture_id\`"
            echo "- Base URL: \`$endpoint\`"
            echo "- Seed: \`$seed\`"
          } >> "$GITHUB_STEP_SUMMARY"

  run:
    name: InWorld suite (macOS)
    needs: fixture
    if: >-
      always() && inputs.macos &&
      (needs.fixture.result == 'success' || needs.fixture.result == 'skipped')
    runs-on: macos-14
    # Shared context for the report job. Per-column results cannot travel this way
    # (the Windows matrix would overwrite them), so those come back as artifacts.
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      commit_sha: ${{ env.COMMIT_SHA }}
      branch_label: ${{ env.BRANCH_LABEL }}
      test_filter: ${{ env.TEST_FILTER }}
    # Budgeted from the step caps below: 30m test + 12m self-preview pass +
    # ~1m40s setup + the on-failure tail (log dump, artifact upload, 2m-capped
    # cleanup) ≈ 47m. Measured green run 31177978453: 19m38s wall over 49 tests.
    timeout-minutes: 50

    env:
      BUILD_URL_INPUT: ${{ inputs.build_url || '' }}
      PR_NUMBER_INPUT: ${{ inputs.pr_number || '' }}
      TEST_FILTER: ${{ inputs.filter != '' && inputs.filter || 'Category=InWorld' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      TESTS_REF: ${{ inputs.tests_ref || '' }}
      FIXTURE_BASE_URL_INPUT: ${{ inputs.fixture_base_url || needs.fixture.outputs.base_url || '' }}
      FIXTURE_BASE_DOMAIN_INPUT: ${{ inputs.fixture_base_domain || needs.fixture.outputs.base_domain || '' }}
      # Same-repo runs (push / dispatch) carry a real commit and ref, so prefer
      # those over the run-id placeholder — the S3 path and PR comment name the
      # actual code under test. Cross-repo callers pass both explicitly.
      COMMIT_SHA: ${{ inputs.commit_sha != '' && inputs.commit_sha || (github.repository == 'decentraland/explorer-automation' && github.sha || format('run-{0}', github.run_id)) }}
      BRANCH_LABEL: ${{ inputs.branch_label != '' && inputs.branch_label || (inputs.tests_ref != '' && inputs.tests_ref || (github.repository == 'decentraland/explorer-automation' && github.ref_name || 'main')) }}
      # vars.* inside a workflow_call run reads the *caller's* repo vars. Kept
      # in lockstep with the bucket secret selected below — see header.
      PUBLIC_URL_PREFIX: ${{ github.repository == 'decentraland/explorer-automation' && vars.DEV_EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL || vars.EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL }}
      # 'false' keeps AltTester Unity logging at Warn per GlobalSetup. Flip to
      # 'true' only when triaging AltTester issues — Debug level adds ~30 MB of
      # polling chatter per run.
      ALT_VERBOSE_LOGS: 'false'
      EXPLORER_FAIL_FAST_INFRA: ${{ inputs.fixture_canary && '1' || '0' }}

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          # TESTS_REF and BRANCH_LABEL are git refs, so '/' is legitimate
          # (refs/heads/foo, feat/bar) and the shared pattern allows it.
          for v_name in TESTS_REF BRANCH_LABEL; do
            v_val="${!v_name}"
            if [ -z "$v_val" ]; then continue; fi
            if ! printf '%s' "$v_val" | grep -Eq '^[A-Za-z0-9._/-]+$' \
               || [ "${v_val#-}" != "$v_val" ]; then
              echo "::error::$v_name='$v_val' contains characters that are not allowed. Allowed: A-Z a-z 0-9 . _ / -, and must not start with '-'."
              exit 1
            fi
          done

          # COMMIT_SHA needs a stricter pattern than the loop above: it lands in
          # the S3 path and in the upload-artifact name, and upload-artifact
          # rejects / \ : < > | * ? and quotes — so '/' must NOT be allowed here.
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[A-Za-z0-9._-]+$' \
             || [ "${COMMIT_SHA#-}" != "$COMMIT_SHA" ]; then
            echo "::error::COMMIT_SHA='$COMMIT_SHA' contains characters that are not allowed. Allowed: A-Z a-z 0-9 . _ -, and must not start with '-'."
            exit 1
          fi

          # pr_number is interpolated into the S3 path and the PR-comment
          # lookup; it is caller-supplied, so pin it to digits.
          if [ -n "${PR_NUMBER_INPUT:-}" ] \
             && ! printf '%s' "$PR_NUMBER_INPUT" | grep -Eq '^[0-9]+$'; then
            echo "::error::pr_number='$PR_NUMBER_INPUT' must be empty or a positive integer."
            exit 1
          fi

          # Only a caller-supplied URL is untrusted input. Empty means the
          # resolve step builds the URL from a hardcoded artifact host below.
          if [ -n "${BUILD_URL_INPUT:-}" ]; then
            case "$BUILD_URL_INPUT" in
              https://explorer-artifacts.decentraland.org/*|https://explorer-artifacts.decentraland.zone/*|https://github.com/decentraland/*|https://objects.githubusercontent.com/*) ;;
              *)
                echo "::error::build_url='$BUILD_URL_INPUT' is not from a trusted host (decentraland artifact bucket or GitHub release)."
                exit 1
                ;;
            esac
          fi

      - name: Resolve build URL
        id: build
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${BUILD_URL_INPUT:-}" ]; then
            echo "::notice::Using caller-supplied build URL."
            echo "build_url=${BUILD_URL_INPUT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fallback: newest unity-explorer `dev` build. dev is the integration
          # branch, so empty-input runs always test against the same moving
          # target instead of whichever PR happened to build last (run-to-run
          # client variance made flake triage ambiguous). Branch builds keep
          # the AltTester scripting define — release artifacts strip it, so a
          # release zip would install but never accept an AltTester connection.
          # Unity Cloud Build publishes push-event builds under a `pu-` prefix
          # (see the event→prefix table in unity-explorer's
          # visual-regression.yml / build-unitycloud.yml).
          ARTIFACT_BASE="https://explorer-artifacts.decentraland.org/@dcl/unity-explorer/branch"
          CANDIDATES_JSON=$(gh api \
            "repos/decentraland/unity-explorer/actions/workflows/build-unitycloud.yml/runs?branch=dev&event=push&status=success&per_page=10" \
            --jq '[.workflow_runs[] | {head_sha, run_number}]')
          BUILD_URL=""
          for i in 0 1 2 3 4; do
            CAND=$(echo "$CANDIDATES_JSON" | jq -r ".[$i]")
            [ "$CAND" = "null" ] && break
            RUN=$(echo "$CAND"  | jq -r '.run_number')
            SHA7=$(echo "$CAND" | jq -r '.head_sha[0:7]')
            URL="${ARTIFACT_BASE}/dev/pu-${RUN}-${SHA7}/Decentraland_macos.zip"
            # `|| true` keeps a DNS/connection failure from killing the step
            # under set -e — warn and fall through to the next candidate.
            # curl still prints its -w output when it exits non-zero, so a
            # `|| echo 000` fallback would concatenate codes ("200000");
            # normalize separately and only when the output is empty.
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -I "$URL" || true)
            HTTP=${HTTP:-000}
            if [ "$HTTP" = "200" ]; then
              BUILD_URL="$URL"
              echo "::notice::Using latest unity-explorer dev build: run=${RUN} sha=${SHA7}"
              break
            fi
            echo "::warning::dev build pu-${RUN}-${SHA7} returned HTTP ${HTTP} — trying next."
          done
          if [ -z "$BUILD_URL" ]; then
            echo "::error::No reachable unity-explorer dev build found in the last 10 successful dev push builds."
            exit 1
          fi
          echo "build_url=${BUILD_URL}" >> "$GITHUB_OUTPUT"

      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -n "${PR_NUMBER_INPUT:-}" ]; then
            echo "number=${PR_NUMBER_INPUT}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A default-branch push has no PR of its own, and `--head` matches on
          # branch name only — it would happily return a fork PR whose head is
          # also named `main` and post this result there.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${HEAD_REF}" != "${DEFAULT_BRANCH:-}" ]; then
            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$HEAD_REF" --state open --json number --jq '.[0].number // ""' 2>/dev/null || echo "")
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "number=" >> "$GITHUB_OUTPUT"

      # `repository` is mandatory: a bare checkout inside a workflow_call run
      # resolves to the CALLER's repo. `mf explorer test` runs in cwd-mode
      # against this workspace, so tests and explorer/ci/* must come from the
      # same explorer-automation ref.
      - uses: actions/checkout@v6
        with:
          repository: decentraland/explorer-automation
          ref: ${{ inputs.tests_ref != '' && inputs.tests_ref || (github.repository == 'decentraland/explorer-automation' && github.sha || 'main') }}

      - name: Configure fixture infrastructure
        if: env.FIXTURE_BASE_URL_INPUT != ''
        env:
          FIXTURE_BASE_URL: ${{ env.FIXTURE_BASE_URL_INPUT }}
          FIXTURE_BASE_DOMAIN: ${{ env.FIXTURE_BASE_DOMAIN_INPUT }}
        run: |
          set -euo pipefail
          chmod +x explorer/ci/configure-fixture.sh
          ./explorer/ci/configure-fixture.sh

      - name: Install LiveKit CLI for fixture preflight
        if: env.FIXTURE_BASE_URL_INPUT != '' && inputs.real_livekit_smoke
        run: |
          set -euo pipefail
          version='2.16.3'
          archive="lk_${version}_darwin_arm64.tar.gz"
          expected_sha='4024c4511dda1dc930dc1e133099c9fb39ff70596df110ae78c0268e0739bbd0'
          install_dir="$RUNNER_TEMP/livekit-cli"
          if ! command -v lk >/dev/null 2>&1; then
            mkdir -p "$install_dir"
            archive_path="$RUNNER_TEMP/$archive"
            curl --fail --silent --show-error --location \
              "https://github.com/livekit/livekit-cli/releases/download/v${version}/${archive}" \
              --output "$archive_path"
            printf '%s  %s\n' "$expected_sha" "$archive_path" | shasum -a 256 -c -
            tar -xzf "$archive_path" -C "$install_dir"
            chmod 0755 "$install_dir/lk"
            echo "$install_dir" >> "$GITHUB_PATH"
            export PATH="$install_dir:$PATH"
          fi
          lk --version

      - name: Preflight fixture control plane
        if: env.FIXTURE_BASE_URL_INPUT != ''
        env:
          FIXTURE_BASE_URL: ${{ env.FIXTURE_BASE_URL_INPUT }}
          # Signalling/control-plane checks stay enabled for every fixture run.
          # The direct UDP/TCP media check is opt-in because hosted CI runners
          # cannot reliably reach an ephemeral task ENI without TURN.
          FIXTURE_LIVEKIT_REAL_SMOKE: ${{ inputs.real_livekit_smoke && '1' || '0' }}
          FIXTURE_LIVEKIT_API_KEY: ${{ vars.FIXTURE_LIVEKIT_API_KEY || 'fixture-livekit-key' }}
          FIXTURE_LIVEKIT_API_SECRET: ${{ vars.FIXTURE_LIVEKIT_API_SECRET || 'fixture-livekit-secret-0123456789-0123456789' }}
          FIXTURE_LIVEKIT_SMOKE_TIMEOUT_SECONDS: '60'
          FIXTURE_LIVEKIT_SMOKE_ATTEMPTS: '3'
          FIXTURE_LIVEKIT_SMOKE_RETRY_DELAY_SECONDS: '5'
        run: |
          set -euo pipefail
          chmod +x explorer/ci/fixture-preflight.sh
          ./explorer/ci/fixture-preflight.sh

      - name: Compute identifiers
        id: ids
        env:
          # github.repository inside a workflow_call run resolves to the caller's repo
          PR_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # S3 path is namespaced by caller repo so unity-explorer and
          # explorer-automation reports never collide. Non-PR runs get a
          # `manual-<run id>` segment so successive dispatches don't
          # overwrite each other.
          REPO_SLUG="${PR_REPO//\//-}"
          PR_SEGMENT="${PR_NUMBER:-manual-${GITHUB_RUN_ID}}"
          S3_PATH="@dcl/${REPO_SLUG}/inworld/${PR_SEGMENT}/${COMMIT_SHA}"
          {
            echo "s3_path=${S3_PATH}"
            echo "report_url=${PUBLIC_URL_PREFIX}/${S3_PATH}/index.html"
          } >> "$GITHUB_OUTPUT"
          # Read back by Record suite result to report this job's wall clock.
          echo "MACOS_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      # Same field set and order as the Windows leg's "Record benchmark context", so the
      # run summary reads the same for every leg. Keep the two in step.
      - name: Record suite context
        env:
          BUILD_URL: ${{ steps.build.outputs.build_url }}
        run: |
          set -euo pipefail
          {
            echo "## InWorld suite (macOS)"
            echo
            echo "- Leg: \`macOS\`"
            echo "- Platform: \`macos-14\` (GitHub-hosted)"
            echo "- Runner: \`${RUNNER_NAME:-?}\`"
            echo "- Fixtures: \`whole selection\`"
            echo "- Planned: \`whole selection\`"
            echo "- Filter: \`${TEST_FILTER}\`"
            echo "- Build: \`${BUILD_URL}\`"
            echo "- Started: \`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # dotnet + AltTester + allure + MetaForge + license — the same chassis
      # run-visual-suite.yml runs, from the same definition. Must come after
      # the checkout above: `uses: ./…` resolves against $GITHUB_WORKSPACE.
      # Unlike the visual suite, this one checks out at `tests_ref`, so a ref
      # predating the composite fails here on a missing action.yml.
      - name: Set up Explorer test runner
        uses: ./.github/actions/setup-explorer-runner
        with:
          github-token: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
          alttester-license: ${{ secrets.ALTTESTER_LICENSE }}

      # rust_audio (com.decentraland.livekit-sdk) calls cpal::supports_input on
      # every device returned by kAudioHardwarePropertyDevices during
      # VoiceChatPlugin init. On GH-hosted macos-14 paravirt the "Apple Virtual
      # Sound Device" answers enumeration but its AudioUnit blocks forever on
      # mach_msg to coreaudiod, wedging the Unity main thread. BlackHole (here)
      # plus the compiled CoreAudio shim (next step) are the fix: BlackHole
      # gives cpal a working default device, the shim hides the paravirt one.
      - name: Route audio to BlackHole (paravirt device is broken)
        run: |
          set -euo pipefail

          # The cask installs the BlackHole AudioServerPlugin into
          # /Library/Audio/Plug-Ins/HAL/; the formula provides SwitchAudioSource.
          brew install --cask blackhole-2ch
          brew install switchaudio-osx

          # AudioServerPlugin is loaded by coreaudiod on demand. Restarting the
          # daemon forces a rescan of /Library/Audio/Plug-Ins/HAL so BlackHole
          # is visible before we set it as default.
          sudo killall coreaudiod 2>/dev/null || true
          sleep 3

          # Default selection writes to
          # ~/Library/Preferences/Audio/com.apple.audio.SystemSettings.plist and
          # is picked up by coreaudiod immediately (no second restart, no reboot).
          SwitchAudioSource -s "BlackHole 2ch" -t input
          SwitchAudioSource -s "BlackHole 2ch" -t output
          # -t system is the "Default System Output Device" slot used for alert
          # sounds. Not load-bearing for the rust_audio hang (cpal doesn't query
          # it), but the paravirt device otherwise keeps holding it — flip it so
          # coreaudiod's state has as few references to it as possible.
          SwitchAudioSource -s "BlackHole 2ch" -t system \
            || echo "(system-default switch unsupported on this version — non-fatal)"

          echo "::group::Default devices after switch"
          echo "Default input:  $(SwitchAudioSource -c -t input)"
          echo "Default output: $(SwitchAudioSource -c -t output)"
          echo "Default system: $(SwitchAudioSource -c -t system 2>/dev/null || echo '(n/a)')"
          echo "::endgroup::"

          # ── Sanity checks. Fail fast if either piece didn't land. ──
          system_profiler SPAudioDataType | grep -qi blackhole || {
            echo "::error::BlackHole did not register with coreaudiod"
            exit 1
          }
          DEFAULT_IN=$(SwitchAudioSource -c -t input)
          case "$DEFAULT_IN" in
            *BlackHole*) echo "✓ Default input is BlackHole" ;;
            *) echo "::error::Default input is '$DEFAULT_IN', expected BlackHole"; exit 1 ;;
          esac

      # ── Apply CI log matrix so InWorld runs get the verbose logging they
      # need. macOS LogMatrixStore path is ~/Library/Application Support/
      # Decentraland/MetaForge/log-matrix.json; the planned Windows chassis
      # (PR #12) applies the same matrix from %LOCALAPPDATA%.
      - name: Apply CI log matrix
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/explorer/ci/log-matrix.json"
          DST="$HOME/Library/Application Support/Decentraland/MetaForge/log-matrix.json"
          if [ ! -f "$SRC" ]; then
            echo "::error::CI log matrix source missing: $SRC"
            exit 1
          fi
          mkdir -p "$(dirname "$DST")"
          cp "$SRC" "$DST"
          echo "Applied CI log matrix: $SRC -> $DST"

      - name: Pre-install Explorer build
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_URL:-}" ]; then
            echo "::error::BUILD_URL is empty (build resolution failed?)"
            exit 1
          fi
          mf explorer install "$BUILD_URL" --non-interactive

      # Build the CoreAudio enumeration shim and prepare Explorer to load it
      # via DYLD_INSERT_LIBRARIES.
      #
      # There is no OS-side lever on macos-14 GH runners: the Sealed System
      # Volume blocks `sudo mv` of
      # /System/Library/Audio/Plug-Ins/HAL/AppleVirtIOSound.driver even with
      # SIP off, and kAudioDevicePropertyIsHidden is not client-settable.
      # Interposing the enumeration call inside the Explorer process so cpal
      # never sees the broken device is the only remaining CI-tunable lever.
      #
      # The shim (explorer/ci/audio_filter.c) interposes
      # AudioObjectGetPropertyData; when called with
      # kAudioHardwarePropertyDevices on kAudioObjectSystemObject it drops
      # Apple Virtual Sound Device and Null Audio Device from the returned
      # AudioDeviceID[]. All other property reads pass through unchanged.
      #
      # codesign --remove-signature on the Explorer binary is belt-and-braces:
      # if Unity Cloud Build ever enables Hardened Runtime without
      # com.apple.security.cs.allow-dyld-environment-variables, dyld would
      # silently drop DYLD_INSERT_LIBRARIES even on direct-exec. Notarization
      # and Gatekeeper aren't in play on a packaged-zip extraction anyway.
      - name: Compile CoreAudio device-filter shim + strip Explorer signature
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/explorer/ci/audio_filter.c"
          OUT=/tmp/audio_filter.dylib
          [ -f "$SRC" ] || { echo "::error::shim source missing at $SRC"; exit 1; }

          # Build a universal (arm64 + arm64e) dylib. macos-14 ships platform
          # binaries (bash, /usr/bin/true, codesign, …) as arm64e (Apple
          # Silicon pointer authentication); an arm64-only dylib refuses to
          # load into them and dyld aborts the whole process. Any child
          # process that inherits DYLD_INSERT_LIBRARIES must be able to load
          # the shim, so ship both slices in one fat Mach-O: Explorer binds
          # the arm64 slice, the bash/coreutils chain binds arm64e.
          clang -dynamiclib -O2 \
            -arch arm64 -arch arm64e \
            -framework CoreAudio -framework CoreFoundation \
            "$SRC" -o "$OUT"

          echo "::group::Built dylib"
          file "$OUT"
          # A single-arch line here is easier to spot than a runtime dyld abort.
          lipo -info "$OUT" || true
          otool -L "$OUT"
          # The __interpose section is what makes DYLD_INSERT_LIBRARIES
          # actually rewrite the binding. If this is missing the shim is
          # a no-op even though it loads.
          otool -s __DATA __interpose "$OUT" || true
          echo "::endgroup::"

          # Quick smoke-load to ensure dyld accepts the dylib.
          echo "::group::Smoke load via dotnet --version"
          DYLD_INSERT_LIBRARIES="$OUT" dotnet --version 2>&1 || true
          echo "::endgroup::"

          # Locate the Explorer .app installed in the previous step and strip
          # its signature so DYLD_INSERT_LIBRARIES is honoured even if
          # Hardened Runtime is enabled.
          # `find ... | head -1` under `set -o pipefail` is a trap: head
          # closes stdin after one line, find writes again, gets SIGPIPE,
          # and the pipeline returns non-zero. Use -print -quit so find
          # exits cleanly after the first match instead.
          #
          # `|| true` is required because `mf explorer install` may store
          # the .app under a path we don't predict here — find then returns
          # non-zero and `set -e` would kill the step before we can fall
          # through to the warning branch.
          EXPLORER_ROOT="$HOME/Library/Application Support/Decentraland"
          EXPLORER_APP=$(find "$EXPLORER_ROOT" \
                              -maxdepth 8 -type d -name "Decentraland.app" \
                              -print -quit 2>/dev/null || true)
          if [ -z "$EXPLORER_APP" ]; then
            echo "::warning::Decentraland.app not found under Explorer install — DYLD_INSERT may be silently dropped if HR is on"
          else
            BIN="$EXPLORER_APP/Contents/MacOS/Explorer"
            echo "::group::codesign before strip"
            codesign -dv --verbose=2 "$BIN" 2>&1 || true
            echo "::endgroup::"
            codesign --remove-signature "$BIN" 2>&1 || true
            echo "::group::codesign after strip"
            codesign -dv --verbose=2 "$BIN" 2>&1 || true
            echo "::endgroup::"

            # Replace the Explorer binary with a shell wrapper that injects
            # DYLD_INSERT_LIBRARIES *only* for the real Explorer exec.
            # Setting DYLD at workflow step `env` level leaks the shim into
            # every child process — bash, mf, dotnet, MSBuild, AspectInjector —
            # and AspectInjector crashes under it, taking `dotnet build` of the
            # NUnit test project down with it.
            #
            # The wrapper exec's the real binary with `exec -a "$0"` so
            # argv[0] still looks like .../Decentraland.app/Contents/MacOS/Explorer
            # (Unity's CFBundle-aware paths and Player.log line prefix
            # would otherwise change to "Explorer.real").
            #
            # The real binary must be named so it sorts AFTER "Explorer"
            # by ordinal file name: MetaForge's direct-exec path selects
            # the first non-dotfile under Contents/MacOS that way, and it
            # has to land on our wrapper. "ExplorerReal" satisfies that.
            REAL="$EXPLORER_APP/Contents/MacOS/ExplorerReal"
            mv "$BIN" "$REAL"
            cat > "$BIN" <<'EOF'
          #!/bin/bash
          # CI-only DYLD-injection wrapper. Lets the audio_filter shim
          # load into Explorer without polluting sibling processes
          # (mf / dotnet / MSBuild / AspectInjector).
          export DYLD_INSERT_LIBRARIES=/tmp/audio_filter.dylib
          exec -a "$0" "$(dirname "$0")/ExplorerReal" "$@"
          EOF
            chmod +x "$BIN"
            echo "::group::Wrapper installed"
            ls -la "$EXPLORER_APP/Contents/MacOS/"
            cat "$BIN"
            echo "::endgroup::"
          fi

      # --env coupling: account/profile must live in the same catalyst env
      # that `mf explorer test` ships via --dclenv, otherwise auth lands in
      # the new-user flow and BaseTest.EnsureInWorld times out on
      # MainMenu.WaitFor. The planned Windows chassis (PR #12) needs the
      # same pairing.
      - name: Provision metaforge test account
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Application Support/Decentraland/Explorer"
          ACCOUNT="ci-inworld-${GITHUB_RUN_ID}"
          mf account create "$ACCOUNT" --env org
          # The token bridge is what lets the Explorer restore this account at
          # startup. A regular account login only writes the cached identity;
          # without --auto-login the client falls back to LoginSelection and
          # every InWorld fixture fails before its first assertion.
          mf account login "$ACCOUNT" --env org --auto-login
          echo "MF_ACCOUNT=${ACCOUNT}" >> "$GITHUB_ENV"

      - name: Clear Explorer Player.log
        run: |
          LOG="$HOME/Library/Logs/Decentraland/Explorer/Player.log"
          if [ -f "$LOG" ]; then rm -f "$LOG" && echo "Cleared $LOG"; fi

      - name: Run InWorld suite
        id: test
        if: env.DRY_RUN != 'true'
        # The fixture preflight now verifies a real LiveKit room join, so a
        # multiplayer outage fails before this step. Keep enough time for the
        # complete InWorld selection once startup succeeds.
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
          # DYLD_INSERT_LIBRARIES is intentionally NOT set here. At step-env
          # scope it leaks into every child process — including AspectInjector,
          # the IL post-processor in the dotnet test build chain, which crashes
          # under it and takes `dotnet build` of the NUnit test project with it.
          # The shim step instead replaces Contents/MacOS/Explorer with a
          # wrapper that exports DYLD only for its own final `exec` of the real
          # binary, so the shim loads into Explorer and nowhere else.
          #
          # Perf capture is opt-in via record_perf. BaseTest only calls
          # PerfSampler when EXPLORER_PERF_RECORD is exactly '1', so the default
          # (and every push-triggered run, where inputs are empty) skips it and
          # pays no artifact/S3 cost. The planned Windows chassis (PR #12) owns
          # a dedicated GPU image, so its numbers are stable enough to record
          # unconditionally.
          EXPLORER_PERF_RECORD: ${{ inputs.record_perf && '1' || '0' }}
          # Stable, upload-artifact-friendly path for PerfSampler output.
          # BaseTest reads this and writes <fixture>/perf.csv + perf-summary.txt here.
          # Picked up by the artifact step below — so the CSV survives even if
          # the test process is killed before [OneTimeTearDown] can attach to Allure.
          EXPLORER_PERF_DIR: ${{ runner.temp }}/explorer-perf
          # OtpMailbox (used by Auth/OTP fixtures) reads these via Environment.GetEnvironmentVariable.
          # Non-sensitive entries may live in Variables or Secrets — `vars.X || secrets.X` picks
          # whichever is set; password must be a Secret.
          IMAP_HOST: ${{ vars.IMAP_HOST || secrets.IMAP_HOST }}
          IMAP_PORT: ${{ vars.IMAP_PORT || secrets.IMAP_PORT }}
          IMAP_USER: ${{ vars.IMAP_USER || secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          OTP_FROM_EMAIL: ${{ vars.OTP_FROM_EMAIL || secrets.OTP_FROM_EMAIL }}
          EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN || secrets.EMAIL_DOMAIN }}
        run: |
          set -euo pipefail
          # Explorer launch args forwarded via mf v2.12.0+ --app-args:
          #   --landscape-terrain-enabled false : the LandscapePlugin renderer
          #     registration (BushOptimized/Rock/TreeOptimized) is where the
          #     macos-14 paravirt freezes; cutting terrain entirely sidesteps
          #     the GPU stall.
          #   --skybox-time-enabled false : mirrors what Visual passes; the
          #     time-of-day skybox simulation isn't load-bearing for InWorld
          #     smoke and saves a bit of paravirt headroom.
          #   --graphics low : on macos-14 this is redundant because
          #     EnforceLowPreset() already fires when MinimumSpecs fails
          #     (which it does on the paravirt GPU/VRAM/RAM), but it makes
          #     the intent explicit and reuses cleanly on Windows T4 (where
          #     specs may pass and the override actually wins).
          #   --skip-minimum-specs-screen : pairs with --graphics so the
          #     EnforceLowPreset path doesn't clobber an explicit higher
          #     preset on adequate hardware; also skips the modal that
          #     BaseTest.DismissMinimumSpecsModalIfPresent polls for.
          # '=' form is mandatory — Spectre.Console parses the space form
          # ("--app-args ...") as a new option starting at --landscape...
          # See MetaForge ExplorerTestSettings.AppArgs description.
          #
          # --report-type None: report generation is ours now, in the step
          # below. metaforge's ReportType offers only LocalServer (generates,
          # then blocks serving a browser — unusable here), SingleFile, and
          # None. SingleFile inlines every attachment as base64 into one HTML
          # and a full-suite run overruns allure's size cap ("The report is too
          # large to be generated in the single file mode!", run 31379557564),
          # taking the whole publish chain down with it. None also subsumes
          # --skip-allure-open: nothing is generated, so there is nothing to
          # open.
          # Teed so the result step can read the count metaforge reports, the same way
          # the Windows shards do, and both rows of the unified table come from one source.
          TEST_EXIT=0
          APP_ARGS="--landscape-terrain-enabled false --skybox-time-enabled false --graphics low --skip-minimum-specs-screen"
          if [ -n "${FIXTURE_APP_ARGS:-}" ]; then
            APP_ARGS="${APP_ARGS} ${FIXTURE_APP_ARGS}"
          fi
          echo "Launching Explorer with app args: ${APP_ARGS}"

          mf explorer test "$BUILD_URL" \
            --non-interactive \
            --filter "$TEST_FILTER" \
            --report-type None \
            --app-args="${APP_ARGS}" \
            2>&1 | tee "$RUNNER_TEMP/mf-test.log" \
            || TEST_EXIT=$?
          exit "$TEST_EXIT"

      # The L1/L2 tests need a client booted with --self-preview-wearables: the
      # run's fresh account owns nothing on-chain, and app args only parse at boot.
      - name: Run self-preview wearable pass
        id: selfpreview
        if: env.DRY_RUN != 'true' && (env.TEST_FILTER == 'Category=InWorld' || contains(env.TEST_FILTER, 'BackpackWearableVisibility'))
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
          BUILD_URL: ${{ steps.build.outputs.build_url }}
          # Mirrored into --self-preview-wearables below: one L1 Qm hat, one L2 eyewear.
          SELF_PREVIEW_WEARABLES: urn:decentraland:ethereum:collections-v1:dcl_launch:dcl_hat_hat,urn:decentraland:matic:collections-v2:0x19f3a2e14ef3f35c7402304ff02b26bef7f31235:0
        run: |
          set -euo pipefail
          # A listening AltTester server makes MetaForge skip the relaunch, keeping the old args.
          pkill -9 -f "Decentraland.app/Contents/MacOS/Explorer" 2>/dev/null || true
          mf explorer server stop --non-interactive || true
          TEST_EXIT=0
          mf explorer test "$BUILD_URL" \
            --non-interactive \
            --filter "Category=SelfPreview" \
            --report-type None \
            --app-args="--landscape-terrain-enabled false --skybox-time-enabled false --graphics low --skip-minimum-specs-screen --self-preview-wearables ${SELF_PREVIEW_WEARABLES}" \
            2>&1 | tee "$RUNNER_TEMP/mf-selfpreview.log" \
            || TEST_EXIT=$?
          [ "$TEST_EXIT" = 0 ] || exit "$TEST_EXIT"

          # A filter matching nothing exits clean — an empty SelfPreview category must not pass.
          if ! sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/mf-selfpreview.log" \
              | grep -qE 'Tests finished:|All [0-9]+ tests? passed'; then
            echo "::error::Self-preview pass reported no test summary — is the SelfPreview category empty?"
            exit 1
          fi

      # The generation metaforge used to do, minus `--single-file`. Writing to
      # the same directory metaforge used keeps the rest of the publish chain
      # untouched: the locate step below still finds index.html, and `aws s3
      # sync` was already syncing a directory, so a multi-file report uploads
      # and serves from S3 unchanged.
      #
      # `always()`: a failed run is exactly when the report matters most.
      #
      # Deliberate behaviour change: a report-generation failure now fails this
      # step, and so the job. metaforge swallowed it — ExplorerTestCommand
      # returned only the test exit code — so before this an all-green run whose
      # report failed stayed green with `_not generated_` in the PR comment,
      # which is how run 31379557564 lost 59 tests' worth of evidence quietly.
      # Losing the evidence should be loud. Note this is the report-FAILED path
      # only; "no results at all" below warns and skips instead.
      - name: Generate Allure report
        if: always() && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          REPORT_DIR="$HOME/Library/Application Support/Decentraland/MetaForge/allure-report"

          # This suite runs metaforge in cwd-mode — the job checks the repo out
          # at tests_ref and `mf explorer test` builds the NUnit project in
          # place — so results land in the workspace build output, NOT under the
          # MetaForge data dir. run-visual-suite.yml deliberately keeps an empty
          # workspace to stay on metaforge's managed clone, so its copy of this
          # step resolves a different path. Don't unify them.
          RESULTS="$GITHUB_WORKSPACE/explorer/Tests/bin/Debug/net10.0/allure-results"
          if [ ! -d "$RESULTS" ]; then
            # -print -quit rather than `| head -1`: under `set -o pipefail` head
            # closes stdin after one line, find writes again and takes SIGPIPE,
            # and the pipeline returns non-zero. Same trap documented above at
            # the Explorer .app lookup.
            RESULTS=$(find "$GITHUB_WORKSPACE/explorer" -type d -name allure-results \
                           -print -quit 2>/dev/null || true)
          fi

          # Gate on *-result.json, not on the directory being non-empty. If the
          # test host is killed mid-fixture (step timeout, or the cleanup step's
          # pkill), Allure.NUnit has already flushed attachments and a
          # *-container.json but no test result — and `allure awesome` happily
          # turns that into a valid report reading {"total":0} / "passed". A
          # zero-test report published behind a green link is worse than none,
          # so require at least one actual result.
          #
          # No results is a different failure from generation failing: nothing
          # ran, so there is nothing to generate. Warn, leave the report absent,
          # and let the locate step yield an empty report_path and skip the
          # upload chain. The raw results and logs still ship as an artifact.
          if [ -z "$RESULTS" ] || \
             [ -z "$(find "$RESULTS" -maxdepth 1 -name '*-result.json' -print -quit 2>/dev/null)" ]; then
            echo "::warning::No Allure test results found — the run produced no *-result.json, so nothing reported before it stopped. Skipping report generation; logs are still attached as an artifact."
            exit 0
          fi

          # Stage into a scratch dir and swap it in only once allure has
          # succeeded. Two reasons, both verified against allure 3.14.3:
          #
          #   1. `allure awesome -o DIR` on a DIR that already holds a report
          #      writes the new one to DIR/awesome/ and leaves the old
          #      index.html byte-identical at the root. The locate step below
          #      prefers the root, so it would publish the STALE report under
          #      this run's URL with no warning. metaforge guarded against this
          #      by deleting the report dir first. Harmless on an ephemeral
          #      runner where the dir starts absent; live on a persistent
          #      self-hosted runner and when running these steps locally.
          #   2. allure copies every attachment into the tree, so a failure
          #      partway through (ENOSPC being the realistic one) can leave a
          #      valid-looking index.html beside incomplete data/ and widgets/.
          #      Staging means index.html appears at the canonical path only
          #      when the whole report is there.
          #
          # Sibling of the destination, so the mv is a same-filesystem rename.
          #
          # Clear the destination BEFORE generating, not after. A previous run's
          # report has no value here, and if generation then fails, `set -e`
          # aborts before the mv and leaves nothing behind — so the locate step
          # correctly reports the report as absent rather than republishing run
          # N's report under run N+1's URL behind a green [Open] link.
          STAGE="${REPORT_DIR}.staging"
          rm -rf "$STAGE" "$REPORT_DIR"
          echo "Generating report from: $RESULTS"
          allure awesome "$RESULTS" -o "$STAGE"
          mv "$STAGE" "$REPORT_DIR"

      # Second of the two DRY_RUN gates on the publish chain: a skipped step
      # reports empty outputs, so every downstream step that requires
      # report_path to be non-empty is already excluded from dry runs by that
      # alone.
      - name: Locate Allure report
        id: report
        if: always() && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          # An exact path check, not a search. metaforge runs with
          # --report-type None, so the generate step above is the only thing that
          # writes a report under the data dir, and it stages the tree and swaps
          # it in atomically — index.html sitting here means a complete report.
          # Searching would only add ways to pick the wrong index.html.
          REPORT_DIR="$HOME/Library/Application Support/Decentraland/MetaForge/allure-report"
          if [ ! -f "$REPORT_DIR/index.html" ]; then
            echo "::warning::Allure report not found; skipping upload."
            {
              echo "report_path="
              echo "report_dir="
            } >> "$GITHUB_OUTPUT"
          else
            echo "Report at: $REPORT_DIR/index.html"
            # report_dir is what actually gets published — the report is a
            # directory of files now, not one self-contained HTML.
            {
              echo "report_path=${REPORT_DIR}/index.html"
              echo "report_dir=${REPORT_DIR}"
            } >> "$GITHUB_OUTPUT"
          fi

      # An ungranted secret arrives as an empty string, so a family mismatch
      # otherwise surfaces as an opaque "Input required and not supplied:
      # aws-region" or `Invalid bucket name ""` from inside the AWS steps,
      # after a full green test run. Fail here naming what's actually missing.
      - name: Verify S3 configuration
        if: always() && steps.report.outputs.report_path != ''
        env:
          CALLER_REPO: ${{ github.repository }}
          BUCKET: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_S3_BUCKET || secrets.EXPLORER_TEAM_S3_BUCKET }}
          REGION: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_DEFAULT_REGION || secrets.EXPLORER_TEAM_AWS_DEFAULT_REGION }}
          ACCESS_KEY_ID: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_ACCESS_KEY_ID || secrets.EXPLORER_TEAM_AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY || secrets.EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ "$CALLER_REPO" = 'decentraland/explorer-automation' ]; then
            FAMILY='DEV_EXPLORER_TEAM_'
          else
            FAMILY='EXPLORER_TEAM_'
          fi

          MISSING=""
          for entry in "S3_BUCKET:${BUCKET:-}" \
                       "AWS_DEFAULT_REGION:${REGION:-}" \
                       "AWS_ACCESS_KEY_ID:${ACCESS_KEY_ID:-}" \
                       "AWS_SECRET_ACCESS_KEY:${SECRET_ACCESS_KEY:-}"; do
            if [ -z "${entry#*:}" ]; then
              MISSING="${MISSING} secrets.${FAMILY}${entry%%:*}"
            fi
          done
          if [ -z "${PUBLIC_URL_PREFIX:-}" ]; then
            MISSING="${MISSING} vars.${FAMILY}S3_BUCKET_PUBLIC_URL"
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Caller ${CALLER_REPO} resolved an empty S3 config:${MISSING}. Those entries must be granted to that repo at the org level and reach this workflow via \`secrets: inherit\`."
            exit 1
          fi

      - name: Configure AWS credentials
        if: always() && steps.report.outputs.report_path != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_ACCESS_KEY_ID || secrets.EXPLORER_TEAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY || secrets.EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_DEFAULT_REGION || secrets.EXPLORER_TEAM_AWS_DEFAULT_REGION }}

      - name: Upload Allure report to S3
        id: s3
        if: always() && steps.report.outputs.report_path != ''
        env:
          BUCKET: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_S3_BUCKET || secrets.EXPLORER_TEAM_S3_BUCKET }}
          S3_PATH: ${{ steps.ids.outputs.s3_path }}
          REPORT_DIR: ${{ steps.report.outputs.report_dir }}
          REPORT_URL: ${{ steps.ids.outputs.report_url }}
        run: |
          set -euo pipefail
          aws s3 sync "$REPORT_DIR" "s3://$BUCKET/$S3_PATH/" \
            --acl public-read \
            --cache-control "public, max-age=300"

          # The upload target (bucket secret) and the link we publish
          # (PUBLIC_URL_PREFIX var) are configured independently, so a mismatched
          # pair yields a green upload behind a dead link. Probe the URL we are
          # about to advertise; warn rather than fail, since the report itself is
          # also attached as a workflow artifact. Retry for CDN propagation.
          for attempt in 1 2 3; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -I "$REPORT_URL" || true)
            [ "$HTTP" = "200" ] && break
            sleep 5
          done
          if [ "${HTTP:-000}" = "200" ]; then
            echo "::notice::Report reachable at $REPORT_URL"
          else
            echo "::warning::Uploaded to s3://$BUCKET/$S3_PATH/ but $REPORT_URL returned HTTP ${HTTP:-000} — the public-URL var and the bucket secret likely name different buckets."
          fi

      # Dump the tail of Player.log + AltTester-Server.log directly into the
      # workflow console so failures are diagnosable without downloading the
      # artifact. Kept under `if: failure()` so green runs don't add noise.
      # Last 400 lines is enough to capture the [BOOT NN] sequence + the
      # AltTester command exchange around a WaitForGone timeout.
      - name: Dump Player.log + AltTester-Server.log tail (on failure)
        if: failure()
        run: |
          set +e
          PLAYER="$HOME/Library/Logs/Decentraland/Explorer/Player.log"
          # AltTester-Server.log lives next to Explorer prefs in Application
          # Support, NOT in ~/Library/Logs (where only Unity's Player.log
          # goes). Player.log itself confirms the path:
          #   "AltTester(R) logs are saved at:
          #    ~/Library/Application Support/Decentraland/Explorer/AltTester-Server.log"
          ALT="$HOME/Library/Application Support/Decentraland/Explorer/AltTester-Server.log"
          echo "::group::Player.log (last 400 lines)"
          if [ -f "$PLAYER" ]; then
            tail -n 400 "$PLAYER"
          else
            echo "Player.log not found at $PLAYER"
            echo "Contents of ~/Library/Logs/Decentraland/Explorer/:"
            ls -la "$HOME/Library/Logs/Decentraland/Explorer/" 2>/dev/null || echo "(directory missing)"
          fi
          echo "::endgroup::"
          echo "::group::AltTester-Server.log (last 200 lines)"
          if [ -f "$ALT" ]; then
            tail -n 200 "$ALT"
          else
            echo "AltTester-Server.log not found at $ALT"
          fi
          echo "::endgroup::"

          # macOS native crash reports — written by ReportCrash when a
          # process dies of a signal (segfault, abort, GPU fault from Metal).
          # Bundle is Decentraland.app but CFBundleExecutable is "Explorer",
          # and macOS names .ips reports after the binary, not the bundle —
          # so on a real crash the file is Explorer-YYYY-MM-DD-HHMMSS.ips.
          # Surface filenames inline so the diagnosis is visible without
          # downloading; the .ips files themselves go to the artifact bundle.
          echo "::group::macOS DiagnosticReports (Decentraland*/Explorer*)"
          DR_DIR="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$DR_DIR" ]; then
            # ReportCrash may also log helper processes (e.g. Sentry
            # CrashpadHandler), so list the whole directory too.
            echo "--- Full directory listing ---"
            ls -la "$DR_DIR" 2>/dev/null | head -50 || echo "(directory unreadable)"
            echo "--- Decentraland*/Explorer* matches ---"
            ls -la "$DR_DIR"/Decentraland* "$DR_DIR"/Explorer* 2>/dev/null || echo "(no matches)"
            LATEST=$(ls -1t "$DR_DIR"/Decentraland*.ips "$DR_DIR"/Explorer*.ips 2>/dev/null | head -1)
            if [ -n "$LATEST" ]; then
              echo "--- latest report: $LATEST ---"
              head -200 "$LATEST"
            fi
          else
            echo "(directory $DR_DIR missing)"
          fi
          echo "::endgroup::"

      # artifact-url backs the Allure cell when the S3 upload did not land, so a failed
      # publish still leaves somewhere to click. Must stay ahead of Record suite result.
      - name: Upload logs and report (artifact fallback)
        id: artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: inworld-macos-${{ env.COMMIT_SHA }}-${{ github.run_id }}
          if-no-files-found: warn
          # Every line below is a path pattern — the block scalar is literal
          # text, so comments cannot live inside it. explorer-perf is empty
          # unless the run was dispatched with record_perf.
          #
          # allure-results is the raw per-test data (results, attachments) and
          # is this job's only safety net when report generation fails. It lives
          # in the cwd-mode build output, NOT under the MetaForge data dir — the
          # glob here used to say `MetaForge/**/allure-results/**` and so
          # silently captured nothing, leaving a failed report with no test
          # detail at all (run 31379557564 yielded only the two logs above).
          #
          # The allure-report copy needs an HTTP origin to view: index.html
          # fetches widgets/*.json and data/* at runtime, and browsers block
          # fetch() over file://, so opening it straight off disk shows an empty
          # report. Serve the unzipped directory (`python3 -m http.server`), or
          # use the S3 link, which is the primary path. Keeping allure-results
          # here also means you can rebuild whatever shape you want locally —
          # `allure awesome <results> --single-file -o <dir>` gives back the
          # openable-from-disk report, which is fine at one fixture's scale.
          # (Note `make explorer-report` does NOT work: its `allure generate
          # --clean --single-file` is Allure 2 syntax, and the chassis installs
          # the Allure 3 CLI, which rejects --clean outright.)
          path: |
            ~/Library/Logs/Decentraland/Explorer/Player.log
            ~/Library/Application Support/Decentraland/Explorer/AltTester-Server.log
            ~/Library/Application Support/Decentraland/MetaForge/allure-report/**
            explorer/Tests/bin/Debug/net10.0/allure-results/**
            ${{ runner.temp }}/mf-test.log
            ${{ runner.temp }}/explorer-perf/**
            ~/Library/Logs/DiagnosticReports/Decentraland*
            ~/Library/Logs/DiagnosticReports/Explorer*

      - name: Summarize report URL
        if: always() && steps.s3.outcome == 'success'
        env:
          URL: ${{ steps.ids.outputs.report_url }}
        run: |
          # Summary line lives in Record suite result, so both legs print one Allure row.
          echo "::notice::Allure report: $URL"

      # One column of the unified table. The PR comment that used to live here is now
      # posted once by the report job, so macOS and both Windows shards land together.
      - name: Record suite result
        if: always()
        env:
          STEP_RESULT: ${{ steps.test.outcome }}
          PREVIEW_RESULT: ${{ steps.selfpreview.outcome }}
          # S3 serves a rendered report, so prefer it; the artifact is a zip to download.
          REPORT_URL: ${{ steps.s3.outcome == 'success' && steps.ids.outputs.report_url || steps.artifact.outputs.artifact-url }}
          REPORT_KIND: ${{ steps.s3.outcome == 'success' && 'Open' || 'Download' }}
        run: |
          set -euo pipefail
          PASSED=null; FAILED=0; SKIPPED=0; RAN=null

          # A failed self-preview pass must not hide behind a green main pass.
          if [ "${PREVIEW_RESULT:-skipped}" = 'failure' ] && [ "${STEP_RESULT:-skipped}" = 'success' ]; then
            STEP_RESULT='failure'
          fi

          # Two summary forms to match: metaforge prints "All N tests passed." when nothing
          # failed and "Tests finished: ..." otherwise. Matching only the latter reported no
          # count exactly on a green run, which is also when a loss check has to work.
          # The self-preview log is separate so its summary cannot shadow the main pass's.
          for LOG in "$RUNNER_TEMP/mf-test.log" "$RUNNER_TEMP/mf-selfpreview.log"; do
            [ -f "$LOG" ] || continue
            PLAIN=$(sed 's/\x1b\[[0-9;]*m//g' "$LOG")
            COUNTS=$(printf '%s\n' "$PLAIN" \
              | grep -oE 'Tests finished: [0-9]+ passed, [0-9]+ failed, [0-9]+ skipped' \
              | tail -n 1 | grep -oE '[0-9]+' | paste -sd' ' - || true)
            GREEN=$(printf '%s\n' "$PLAIN" \
              | grep -oE 'All [0-9]+ tests? passed' \
              | tail -n 1 | grep -oE '[0-9]+' || true)

            P=''; F=0; S=0
            if [ -n "$COUNTS" ]; then
              P=$(echo "$COUNTS" | cut -d' ' -f1)
              F=$(echo "$COUNTS" | cut -d' ' -f2)
              S=$(echo "$COUNTS" | cut -d' ' -f3)
            elif [ -n "$GREEN" ]; then
              P=$GREEN
            fi

            if [ -n "$P" ]; then
              if [ "$PASSED" = null ]; then PASSED=0; RAN=0; fi
              PASSED=$((PASSED + P)); FAILED=$((FAILED + F)); SKIPPED=$((SKIPPED + S))
              RAN=$((RAN + P + F + S))
            fi
          done

          mkdir -p "$RUNNER_TEMP/inworld-result"
          jq -n \
            --arg label   'macOS' \
            --arg result  "${STEP_RESULT:-skipped}" \
            --arg runner  "macos-14" \
            --arg report  "${REPORT_URL}" \
            --arg kind    "${REPORT_KIND:-Open}" \
            --argjson passed "$PASSED" --argjson failed "$FAILED" \
            --argjson skipped "$SKIPPED" --argjson ran "$RAN" \
            --argjson seconds "$(( $(date -u +%s) - ${MACOS_STARTED_AT:-$(date -u +%s)} ))" \
            '{label:$label, order:0, result:$result, passed:$passed, failed:$failed,
              skipped:$skipped, ran:$ran, planned:0, fixtures:"", runner:$runner,
              seconds:$seconds, report:$report, report_kind:$kind}' \
            > "$RUNNER_TEMP/inworld-result/row.json"
          cat "$RUNNER_TEMP/inworld-result/row.json"

          # Same three closing rows as the Windows leg, in the same plain wording. The
          # emoji verdicts live only in the report job's table, whose shell can carry them:
          # a PowerShell body has to stay ASCII, so a per-leg block cannot.
          case "${STEP_RESULT:-skipped}" in
            success) VERDICT='passed' ;;
            skipped) VERDICT='skipped' ;;
            *) if [ "$FAILED" != 0 ]; then VERDICT="$FAILED failed"; else VERDICT='failed'; fi ;;
          esac
          if [ "$RAN" = null ]; then RAN_TEXT='not reported'; else RAN_TEXT="$RAN"; fi
          if [ -n "${REPORT_URL:-}" ]; then
            ALLURE="[${REPORT_KIND:-Open}](${REPORT_URL})"
          else
            ALLURE='not generated'
          fi
          {
            echo "- Result: ${VERDICT}"
            echo "- Ran: \`${RAN_TEXT}\`"
            echo "- Allure: ${ALLURE}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload suite result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inworld-result-macos
          path: ${{ runner.temp }}/inworld-result/row.json
          if-no-files-found: warn
          retention-days: 7

      # macos-14 is ephemeral so cleanup is best-effort; we still release the
      # AltTester license slot and remove the metaforge test account so the
      # activation pool doesn't bloat with dead slots.
      #
      # Every `mf` subcommand is bounded by a watchdog and the whole step is
      # capped at 2 minutes: `mf explorer server stop` waits indefinitely on a
      # graceful shutdown when Explorer's Unity main thread is wedged on
      # `mach_msg` to coreaudiod, because the in-process SIGTERM handler can
      # never run. Killing the bundle executable up front is the only reliable
      # way to unblock the chain.
      - name: Cleanup metaforge state
        if: always()
        timeout-minutes: 2
        run: |
          set +e
          # Force-kill the Explorer process FIRST. CFBundleExecutable is
          # "Explorer", not "Decentraland" — match by the full bundle path
          # so we don't accidentally kill an unrelated `Explorer` binary
          # the runner might have. `-9` because anything softer waits on
          # the same wedged main thread we're trying to escape from.
          pkill -9 -f "Decentraland.app/Contents/MacOS/Explorer" 2>/dev/null || true
          sleep 1

          # Per-command timeout helper. macOS doesn't ship `timeout(1)` in
          # /usr/bin (it's a GNU coreutils binary), and we don't want to
          # take a dependency on `brew install coreutils` just for this.
          # Fork + watchdog SIGKILL is portable and good enough — we only
          # care about an upper bound on how long a single `mf` call can
          # block the cleanup step.
          run_with_timeout() {
            local secs=$1; shift
            "$@" &
            local pid=$!
            ( sleep "$secs" && kill -9 "$pid" 2>/dev/null ) &
            local watchdog=$!
            wait "$pid" 2>/dev/null
            local rc=$?
            kill -9 "$watchdog" 2>/dev/null
            return $rc
          }

          run_with_timeout 30 mf explorer server stop --non-interactive || true
          run_with_timeout 30 mf alttester deactivate --non-interactive || true
          if [ -n "${MF_ACCOUNT:-}" ]; then
            run_with_timeout 30 mf account remove "$MF_ACCOUNT" --yes --non-interactive || true
          fi

  # Nested rather than inlined: the two install chains (bash/brew/dmg against
  # PowerShell/zip, ephemeral GitHub-hosted against an autoscaled GPU pool) share
  # almost nothing. Calling it from here is what puts both legs under one caller
  # job, and so under one fold, instead of the two the callers used to show.
  windows:
    name: Windows
    needs: fixture
    if: >-
      always() && inputs.windows &&
      (needs.fixture.result == 'success' || needs.fixture.result == 'skipped')
    uses: ./.github/workflows/windows-inworld-custom-image.yml
    with:
      scope: ${{ inputs.scope }}
      test_filter: ${{ inputs.filter != '' && inputs.filter || 'Category=InWorld' }}
      verification_screenshots: false
      # Same expression the macOS leg resolves COMMIT_SHA with, so both legs publish under
      # one commit prefix. Inlined rather than taken from that job's outputs, which would
      # serialize the two legs behind each other.
      commit_sha: ${{ inputs.commit_sha != '' && inputs.commit_sha || (github.repository == 'decentraland/explorer-automation' && github.sha || format('run-{0}', github.run_id)) }}
      pr_number: ${{ inputs.pr_number }}
      # Its own artifact: build_url points at the macOS zip. Left empty the leg
      # resolves the newest dev build, so a caller gating one commit has to say
      # which Windows build goes with it.
      build_url: ${{ inputs.windows_build_url }}
      # Both legs from one ref, and — as on macOS — a cross-repo caller has no
      # explorer/ci to check out without it.
      tests_ref: ${{ inputs.tests_ref }}
      fixture_canary: ${{ inputs.fixture_canary }}
      real_livekit_smoke: ${{ inputs.real_livekit_smoke }}
      fixture_base_url: ${{ inputs.fixture_base_url || needs.fixture.outputs.base_url || '' }}
      fixture_base_domain: ${{ inputs.fixture_base_domain || needs.fixture.outputs.base_domain || '' }}
      # A managed run is an external fixture from the Windows leg's point of view,
      # even when the dispatch left the compatibility mode at its default `org`.
      fixture_mode: ${{ inputs.provision_fixture && 'external' || inputs.fixture_mode }}
      fixture_image: ${{ inputs.fixture_image }}
      fixture_ref: ${{ inputs.fixture_ref }}
    secrets: inherit

  # Cleanup owns the lease through the same OIDC role. It runs after both test
  # legs, including when one of them failed. The Lambda's scheduled sweep is
  # the backstop for a workflow cancellation before this job starts.
  fixture-cleanup:
    name: Destroy fixture infrastructure
    needs: [fixture, run, windows]
    if: >-
      always() &&
      (inputs.provision_fixture || inputs.fixture_mode == 'external') &&
      inputs.fixture_base_url == '' && needs.fixture.result != 'skipped'
    runs-on: ubuntu-latest
    environment: e2e
    timeout-minutes: 10
    steps:
      - name: Check out automation helpers
        uses: actions/checkout@v6
        with:
          repository: decentraland/explorer-automation
          ref: ${{ inputs.tests_ref != '' && inputs.tests_ref || (github.repository == 'decentraland/explorer-automation' && github.sha || 'main') }}

      - name: Validate fixture manager configuration
        env:
          FIXTURE_MANAGER_ROLE_ARN: ${{ inputs.fixture_manager_role_arn }}
          FIXTURE_MANAGER_FUNCTION: ${{ inputs.fixture_manager_function }}
        run: |
          set -euo pipefail
          for name in FIXTURE_MANAGER_ROLE_ARN FIXTURE_MANAGER_FUNCTION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name must be configured for managed fixture cleanup"
              exit 1
            fi
          done

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.fixture_manager_role_arn }}
          aws-region: ${{ inputs.fixture_manager_region }}
          role-session-name: e2e-fixture-cleanup-${{ github.run_id }}

      - name: Destroy fixture infrastructure
        env:
          E2E_FIXTURE_MANAGER_FUNCTION_NAME: ${{ inputs.fixture_manager_function }}
          AWS_REGION: ${{ inputs.fixture_manager_region }}
          FIXTURE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          bash explorer/ci/invoke-fixture-manager.sh destroy

  # One table for every leg. Each leg posts its own row as an artifact because a
  # matrix job cannot carry per-instance outputs, and shared context (commit, PR,
  # report URL) rides the macOS job's outputs.
  report:
    name: Results
    needs: [run, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect result rows
        uses: actions/download-artifact@v4
        with:
          pattern: inworld-result-*
          path: rows

      - name: Build the results table
        id: table
        env:
          COMMIT_SHA: ${{ needs.run.outputs.commit_sha }}
          BRANCH_LABEL: ${{ needs.run.outputs.branch_label }}
          TEST_FILTER: ${{ needs.run.outputs.test_filter }}
        run: |
          set -euo pipefail

          # A leg that died before writing its row leaves none, so an absent file has to
          # read as "no result" rather than silently shrinking the table.
          #
          # The BOM strip is belt and braces: a Windows leg writing its row through anything
          # BOM-emitting would put one mid-stream, where jq -s reads it as a stray literal
          # rather than as leading whitespace.
          ROWS=$(find rows -name row.json -exec cat {} + 2>/dev/null \
            | sed '1s/^\xEF\xBB\xBF//; s/\xEF\xBB\xBF//g' \
            | jq -s 'sort_by(.order)')
          echo "::group::Collected rows"
          echo "$ROWS" | jq .
          echo "::endgroup::"

          if [ "$(echo "$ROWS" | jq 'length')" -eq 0 ]; then
            echo "::warning::No leg reported a result; nothing to tabulate."
            echo "posted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$ROWS" | jq -r '
            def dur: if . == null then "-"
                     else ((./60)|floor|tostring) + "m" + ((.%60)|tostring) + "s" end;
            def verdict:
              if .result == "success" then "✅ passed"
              elif .result == "skipped" or .result == "" or .result == null then "⏭ skipped"
              elif (.failed // 0) > 0 then "❌ " + (.failed|tostring) + " failed"
              else "❌ failed" end;
            def tests:
              if .ran == null then "not reported"
              elif (.planned // 0) > 0 then (.ran|tostring) + " / " + (.planned|tostring)
              else (.ran|tostring) end;
            # macOS publishes a rendered report to S3, the Windows shards an artifact zip, so
            # the link text names which one it is rather than pretending they are the same.
            def allure:
              if (.report // "") == "" then "not generated"
              else "[" + (.report_kind // "Open") + "](" + .report + ")" end;
            "| | " + ([.[].label] | join(" | ")) + " |",
            "|---|" + ([.[] | "---"] | join("|")) + "|",
            "| Result | " + ([.[] | verdict] | join(" | ")) + " |",
            "| Tests | " + ([.[] | tests] | join(" | ")) + " |",
            "| Duration | " + ([.[] | .seconds | dur] | join(" | ")) + " |",
            "| Allure | " + ([.[] | allure] | join(" | ")) + " |"
          ' > table.md

          FAILED=$(echo "$ROWS" | jq '[.[] | select(.result != "success" and .result != "skipped")] | length')
          TOTAL=$(echo "$ROWS" | jq 'length')
          if [ "$FAILED" -eq 0 ]; then
            STATUS="✅ **InWorld suite passed** on all $TOTAL legs."
          else
            STATUS="❌ **InWorld suite failed** on $FAILED of $TOTAL legs."
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo "## InWorld suite"
            echo
            echo "$STATUS"
            echo
            cat table.md
            echo
            echo "Commit \`${COMMIT_SHA:-?}\` · branch \`${BRANCH_LABEL:-?}\` · filter \`${TEST_FILTER:-?}\` · [run #${GITHUB_RUN_ID}](${RUN_URL})"
            echo
            echo "<sub>macOS on \`macos-14\`, Windows shards on \`win-gpu-t4-explorer\`. Updated on every run.</sub>"
          } > comment.md

          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          echo "posted=true" >> "$GITHUB_OUTPUT"

      - name: Find existing PR comment
        if: steps.table.outputs.posted == 'true' && needs.run.outputs.pr_number != ''
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: find-comment
        with:
          repository: ${{ github.repository }}
          issue-number: ${{ needs.run.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: '## InWorld suite'

      - name: Comment results on PR
        if: steps.table.outputs.posted == 'true' && needs.run.outputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          repository: ${{ github.repository }}
          issue-number: ${{ needs.run.outputs.pr_number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body-path: comment.md

      # The legs' own conclusions do not gate this workflow's, so a red leg has to
      # be re-raised here or a failing suite would report green to the caller.
      - name: Fail if a leg failed
        if: needs.run.result == 'failure' || needs.windows.result == 'failure'
        run: |
          echo "::error::macOS=${{ needs.run.result }} windows=${{ needs.windows.result }}"
          exit 1
