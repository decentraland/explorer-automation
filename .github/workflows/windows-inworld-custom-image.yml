name: Windows InWorld custom-image benchmark

on:
  workflow_call:
    inputs:
      shards:
        description: 'Shard plan from Resolve test scope, as a JSON array. Empty runs test_filter on one runner.'
        required: false
        default: ''
        type: string
      test_filter:
        description: 'NUnit filter. Used only for a shard the plan left without one.'
        required: false
        default: ''
        type: string
      verification_screenshots:
        description: 'Capture intermediate verification screenshots.'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      shards:
        description: 'Shard plan as a JSON array. Leave empty to run test_filter on a single runner.'
        required: false
        default: ''
        type: string
      test_filter:
        description: 'NUnit filter. Use Category=InWorld for the complete suite.'
        required: false
        default: 'Name=TestExplorerIsInWorldFromTokenBridge'
        type: string
      verification_screenshots:
        description: 'Capture intermediate verification screenshots (slow; final test screenshots remain enabled).'
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  # Keep duplicate pushes serialized, while allowing explicitly dispatched
  # shards to use the larger runner's configured job concurrency.
  group: windows-inworld-custom-image-benchmark-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    # Explicit, or the matrix appends every value it carries — including the whole filter.
    name: Windows InWorld tests ${{ matrix.name }}
    runs-on: win-gpu-t4-explorer
    strategy:
      fail-fast: false
      # One entry per runner, planned by explorer/ci/ScopeInWorldTests from the fixtures the
      # PR actually reaches. Never a literal fixture list: the suite outgrows one silently.
      matrix:
        include: ${{ fromJSON(inputs.shards != '' && inputs.shards || '[{"index":1,"name":"1/1","filter":"","fixtures":"","tests":0}]') }}
    timeout-minutes: 55

    env:
      BUILD_URL: https://explorer-artifacts.decentraland.org/@dcl/unity-explorer/branch/dev/pu-24728-9248698/Decentraland_windows64.zip
      TEST_FILTER: ${{ matrix.filter != '' && matrix.filter || inputs.test_filter || 'Name=TestExplorerIsInWorldFromTokenBridge' }}
      WINDOWS_SHARD: ${{ matrix.name }}
      SHARD_INDEX: ${{ matrix.index }}
      SHARD_FIXTURES: ${{ matrix.fixtures }}
      # 0 when the plan could not weight the split; the loss check then only asserts
      # that the shard ran something.
      SHARD_EXPECTED_TESTS: ${{ matrix.tests }}
      ALT_VERBOSE_LOGS: 'false'
      EXPLORER_PERF_RECORD: '0'
      VERIFY_SCREENSHOTS: ${{ inputs.verification_screenshots && '1' || '0' }}

    steps:
      - name: Check out automation tests
        uses: actions/checkout@v6

      - name: Record benchmark context
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          # Same field set and order as the macOS leg in run-inworld-suite.yml, so the run
          # summary reads the same for every leg. Keep the two in step.
          $fixtures = if ($env:SHARD_FIXTURES) { $env:SHARD_FIXTURES } else { "whole selection" }
          $planned = if ([int]$env:SHARD_EXPECTED_TESTS -gt 0) { "$env:SHARD_EXPECTED_TESTS tests" } else { "whole selection" }
          @(
            "## InWorld suite (Windows $env:WINDOWS_SHARD)"
            ""
            "- Leg: ``Windows $env:WINDOWS_SHARD``"
            "- Platform: ``win-gpu-t4-explorer`` (image ``unity-explorer-windows:1.0.0``)"
            "- Runner: ``$env:RUNNER_NAME``"
            "- Fixtures: ``$fixtures``"
            "- Planned: ``$planned``"
            "- Filter: ``$env:TEST_FILTER``"
            "- Build: ``$env:BUILD_URL``"
            "- Started: ``$([DateTime]::UtcNow.ToString('o'))``"
          ) >> $env:GITHUB_STEP_SUMMARY
          # Read back by Record shard result to report this shard's wall clock.
          "SHARD_STARTED_AT=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          nvidia-smi
          git --version
          dotnet --version
          node --version
          mf --version
          allure --version

      - name: Verify required secrets
        shell: powershell
        env:
          ALTTESTER_LICENSE: ${{ secrets.ALTTESTER_LICENSE }}
          GH_TOKEN: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
        run: |
          if (-not $env:ALTTESTER_LICENSE) { throw "ALTTESTER_LICENSE is not available" }
          if (-not $env:GH_TOKEN) { throw "REPOS_READ_ONLY_TOKEN is not available" }
          gh api repos/decentraland/MetaForge/releases/latest --jq '.tag_name'

      - name: Apply CI log matrix
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $source = Join-Path $env:GITHUB_WORKSPACE "explorer\ci\log-matrix.json"
          $destination = Join-Path $env:LOCALAPPDATA "Decentraland\MetaForge\log-matrix.json"
          if (-not (Test-Path $source)) { throw "CI log matrix source missing: $source" }
          New-Item (Split-Path $destination -Parent) -ItemType Directory -Force | Out-Null
          Copy-Item $source $destination -Force

      - name: Activate AltTester license
        shell: powershell
        env:
          ALTTESTER_LICENSE: ${{ secrets.ALTTESTER_LICENSE }}
        run: |
          $ErrorActionPreference = "Stop"
          mf alttester set-license $env:ALTTESTER_LICENSE

      - name: Pre-install Explorer build
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          mf explorer install $env:BUILD_URL --non-interactive

      - name: Provision MetaForge test account
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $userdata = Join-Path $env:USERPROFILE "AppData\LocalLow\Decentraland\Explorer"
          New-Item $userdata -ItemType Directory -Force | Out-Null
          $account = "ci-inworld-$env:GITHUB_RUN_ID-$env:SHARD_INDEX"
          # MetaForge prints the generated seed phrase and auth token. Capture
          # its output so ephemeral test credentials never reach Actions logs.
          $createOutput = & mf account create $account --env org 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "MetaForge account creation failed" }
          $loginOutput = & mf account login $account --env org 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "MetaForge account login failed" }
          Write-Host "Provisioned ephemeral MetaForge account $account for org"
          "MF_ACCOUNT=$account" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Clear Explorer logs
        shell: powershell
        run: |
          $logRoot = Join-Path $env:USERPROFILE "AppData\LocalLow\Decentraland\Explorer"
          @("Player.log", "AltTester-Server.log") | ForEach-Object {
            $log = Join-Path $logRoot $_
            if (Test-Path $log) { Remove-Item $log -Force }
          }

      - name: Run InWorld suite
        id: test
        # Sized for the whole category on one runner, so a shard has ample headroom.
        timeout-minutes: 45
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
        run: |
          # Keep the server and test command in the same Actions step. The
          # runner terminates tracked child processes at step boundaries.
          $ErrorActionPreference = "Stop"
          $stdout = Join-Path $env:RUNNER_TEMP "alttester-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "alttester-stderr.log"
          $mf = (Get-Command mf -ErrorAction Stop).Source
          $server = Start-Process -FilePath $mf `
            -ArgumentList @('alttester', 'run', '--timeout', '120', '--verbose') `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          $env:ALTTESTER_MF_PID = $server.Id
          "ALTTESTER_MF_PID=$($server.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $deadline = [DateTime]::UtcNow.AddSeconds(120)
          $listening = $false
          do {
            if ($server.HasExited) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "MetaForge AltTester server exited before opening port 13000"
            }
            try {
              $client = [System.Net.Sockets.TcpClient]::new()
              $client.Connect('127.0.0.1', 13000)
              $client.Dispose()
              $listening = $true
              Write-Host "AltTester server is listening on 127.0.0.1:13000"
            } catch {
              Start-Sleep -Seconds 2
            }
          } while (-not $listening -and [DateTime]::UtcNow -lt $deadline)

          if (-not $listening) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "AltTester did not open port 13000 within 120 seconds"
          }

          # With AltTester already running, MetaForge assumes an app is also
          # connected and intentionally skips Explorer launch. Launch the
          # exact pre-installed build ourselves and verify its AltTester server
          # receives a command before handing control to NUnit.
          $explorerRoot = Join-Path $env:LOCALAPPDATA "Decentraland\MetaForge\explorer"
          $explorer = Get-ChildItem $explorerRoot -Recurse -Filter "Decentraland.exe" -File |
            Where-Object { $_.FullName -like "*pu-24728-9248698*" } |
            Select-Object -First 1
          if (-not $explorer) { throw "Pre-installed Explorer executable was not found under $explorerRoot" }

          $logMatrix = Join-Path $env:LOCALAPPDATA "Decentraland\MetaForge\log-matrix.json"
          $explorerProcess = Start-Process -FilePath $explorer.FullName `
            -ArgumentList @(
              '--skip-version-check', '--alttester', '--position', '100,100', '--dclenv', 'org',
              '--landscape-terrain-enabled', 'false', '--skybox-time-enabled', 'false',
              '--graphics', 'low', '--skip-minimum-specs-screen', '--use-log-matrix', $logMatrix
            ) `
            -PassThru
          "EXPLORER_PID=$($explorerProcess.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Explorer started with PID $($explorerProcess.Id): $($explorer.FullName)"

          $appLog = Join-Path $env:USERPROFILE "AppData\LocalLow\Decentraland\Explorer\AltTester-Server.log"
          $connectDeadline = [DateTime]::UtcNow.AddSeconds(120)
          $appConnected = $false
          do {
            if ($explorerProcess.HasExited) { throw "Explorer exited before connecting to AltTester" }
            if (Test-Path $appLog) {
              $appConnected = Select-String -Path $appLog -Pattern 'command received' -Quiet
            }
            if (-not $appConnected) { Start-Sleep -Seconds 2 }
          } while (-not $appConnected -and [DateTime]::UtcNow -lt $connectDeadline)
          if (-not $appConnected) { throw "Explorer did not connect to AltTester within 120 seconds" }
          Write-Host "Explorer exchanged commands with AltTester; starting NUnit suite"

          # No target: run against the explicitly launched Explorer session.
          $ErrorActionPreference = "Continue"
          # Teed so the next step can read the count MetaForge reports. A pipe does not
          # disturb $LASTEXITCODE, which still carries the native exit code.
          mf explorer test `
            --non-interactive `
            --filter "$env:TEST_FILTER" `
            --report-type SingleFile `
            --skip-allure-open | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "mf-test.log")
          exit $LASTEXITCODE

      - name: Locate benchmark outputs
        id: outputs
        if: always()
        shell: powershell
        run: |
          $roots = @(
            (Join-Path $env:LOCALAPPDATA "Decentraland\MetaForge"),
            (Join-Path $env:APPDATA "Decentraland\MetaForge")
          )
          $report = $null
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            $report = Get-ChildItem $root -Recurse -Filter "index.html" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*allure-report*" } |
              Select-Object -First 1
            if ($report) { break }
          }
          if ($report) {
            "report_directory=$($report.Directory.FullName)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          $playerLog = Join-Path $env:USERPROFILE "AppData\LocalLow\Decentraland\Explorer\Player.log"
          if (Test-Path $playerLog) {
            "player_log=$playerLog" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          $diagnostics = Join-Path $env:GITHUB_WORKSPACE "benchmark-diagnostics"
          New-Item $diagnostics -ItemType Directory -Force | Out-Null
          $diagnosticFiles = @(
            (Join-Path $env:RUNNER_TEMP "alttester-stdout.log"),
            (Join-Path $env:RUNNER_TEMP "alttester-stderr.log"),
            (Join-Path $env:USERPROFILE "AppData\LocalLow\Decentraland\Explorer\AltTester-Server.log")
          )
          foreach ($file in $diagnosticFiles) {
            if (Test-Path $file) { Copy-Item $file $diagnostics -Force }
          }

      # artifact-url is what makes this leg's Allure cell a link instead of the bare word
      # "artifact". Must stay ahead of Record shard result, which reads the output.
      - name: Upload Allure report
        id: allure
        if: always() && steps.outputs.outputs.report_directory != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-custom-image-allure-shard${{ matrix.index }}-${{ github.run_id }}
          path: ${{ steps.outputs.outputs.report_directory }}
          retention-days: 7

      - name: Upload Explorer log
        if: always() && steps.outputs.outputs.player_log != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-custom-image-player-log-shard${{ matrix.index }}-${{ github.run_id }}
          path: ${{ steps.outputs.outputs.player_log }}
          retention-days: 7

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-custom-image-diagnostics-shard${{ matrix.index }}-${{ github.run_id }}
          path: benchmark-diagnostics
          if-no-files-found: warn
          retention-days: 7

      # Feeds the unified table in run-inworld-suite.yml's report job. A matrix job cannot
      # carry per-instance outputs, so the row travels as an artifact.
      #
      # ASCII only in this body: powershell.exe reads the generated .ps1 as ANSI, so a UTF-8
      # dash arrives as mojibake and fails to parse.
      - name: Record shard result
        if: always()
        shell: powershell
        env:
          STEP_RESULT: ${{ steps.test.outcome }}
          REPORT_URL: ${{ steps.allure.outputs.artifact-url }}
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "mf-test.log"

          # Two summary forms to match: metaforge prints "All N tests passed." when nothing
          # failed and "Tests finished: ..." otherwise. Matching only the latter reported no
          # count exactly on a green shard, which also left the loss check below inert.
          $passed = $null; $failed = 0; $skipped = 0
          if (Test-Path $log) {
            $text = Get-Content $log -Raw
            $found = [regex]::Matches($text,
              'Tests finished:\s*(\d+)\s*passed,\s*(\d+)\s*failed,\s*(\d+)\s*skipped')
            $green = [regex]::Matches($text, 'All\s+(\d+)\s+tests?\s+passed')

            if ($found.Count -gt 0) {
              $g = $found[$found.Count - 1].Groups
              $passed = [int]$g[1].Value; $failed = [int]$g[2].Value; $skipped = [int]$g[3].Value
            }
            elseif ($green.Count -gt 0) {
              $passed = [int]$green[$green.Count - 1].Groups[1].Value; $failed = 0; $skipped = 0
            }
          }

          $expected = 0
          if ($env:SHARD_EXPECTED_TESTS) { $expected = [int]$env:SHARD_EXPECTED_TESTS }
          $ran = if ($null -eq $passed) { $null } else { $passed + $failed + $skipped }

          $row = [ordered]@{
            label    = "Windows $env:WINDOWS_SHARD"
            order    = 1 + [int]$env:SHARD_INDEX
            result   = $env:STEP_RESULT
            passed   = $passed
            failed   = $failed
            skipped  = $skipped
            ran      = $ran
            planned  = $expected
            fixtures = $env:SHARD_FIXTURES
            runner   = $env:RUNNER_NAME
            seconds  = [int]([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int]$env:SHARD_STARTED_AT)
            report   = "$env:REPORT_URL"
            # An artifact zip, not a served report, so the table says so.
            report_kind = 'Download'
          }
          $dir = Join-Path $env:RUNNER_TEMP "inworld-result"
          New-Item $dir -ItemType Directory -Force | Out-Null
          # WriteAllText, not Out-File -Encoding utf8: the latter emits a BOM on 5.1, and the
          # report job concatenates these rows, so a BOM lands mid-stream and jq refuses it.
          [System.IO.File]::WriteAllText((Join-Path $dir "row.json"), ($row | ConvertTo-Json -Compress))
          Get-Content (Join-Path $dir "row.json")

          # Same three closing rows as the macOS leg. Keep the two in step.
          $verdict = if ($env:STEP_RESULT -eq 'success') { 'passed' }
                     elseif ($env:STEP_RESULT -eq 'skipped') { 'skipped' }
                     elseif ($failed -gt 0) { "$failed failed" }
                     else { 'failed' }
          $ranText = if ($null -eq $ran) { 'not reported' } else { "$ran of $expected planned" }
          $allure = if ($env:REPORT_URL) { "[Download]($env:REPORT_URL)" } else { 'not generated' }
          @(
            "- Result: $verdict"
            "- Ran: ``$ranText``"
            "- Allure: $allure"
          ) >> $env:GITHUB_STEP_SUMMARY

          # A vstest filter matching nothing exits clean, so a shard running less than it was
          # planned is the loss this catches. An absent count is not proof of loss: the step
          # that would have printed it already failed and said so.
          if ($null -eq $ran) {
            Write-Host "::warning::MetaForge reported no test count for shard $env:WINDOWS_SHARD"
            exit 0
          }
          if ($ran -eq 0) {
            throw "Shard $env:WINDOWS_SHARD ran no tests, so its filter matched nothing"
          }
          if ($expected -gt 0 -and $ran -lt $expected) {
            throw "Shard $env:WINDOWS_SHARD ran $ran of $expected planned tests"
          }
          Write-Host "Shard $env:WINDOWS_SHARD ran $ran test(s), planned $expected"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inworld-result-win-${{ matrix.index }}
          path: ${{ runner.temp }}/inworld-result/row.json
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup MetaForge state
        if: always()
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          try { mf explorer server stop --non-interactive } catch { Write-Host "server stop: $_" }

          Get-Process | Where-Object { $_.ProcessName -match "Decentraland|Unity|AltTester" } |
            Stop-Process -Force -ErrorAction SilentlyContinue

          if ($env:ALTTESTER_MF_PID) {
            Stop-Process -Id $env:ALTTESTER_MF_PID -Force -ErrorAction SilentlyContinue
          }

          try { mf alttester deactivate --non-interactive } catch { Write-Host "AltTester deactivate: $_" }
          if ($env:MF_ACCOUNT) {
            try { mf account remove $env:MF_ACCOUNT --yes --non-interactive } catch { Write-Host "account remove: $_" }
          }
