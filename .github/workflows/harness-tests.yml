name: Test automation harness

on:
  pull_request:
    paths:
      - 'explorer/Tests/**'
      - 'explorer/Harness.Tests/**'
      - '.github/workflows/harness-tests.yml'
  push:
    branches: [main]
    paths:
      - 'explorer/Tests/**'
      - 'explorer/Harness.Tests/**'
      - '.github/workflows/harness-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test explorer/Harness.Tests/Harness.Tests.csproj --configuration Release
