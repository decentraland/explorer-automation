name: InWorld (PR)

# Runs the InWorld suite on PRs, scoped to what the PR actually touches:
#
#   CI or non-symbol-reachable test infra changed -> the whole Category=InWorld suite
#   anything else under explorer/Tests/           -> the fixtures that can reach it,
#                                                    resolved by explorer/ci/ScopeInWorldTests
#
# The scope tool answers "which Category=InWorld fixtures can reach these files"
# from Roslyn symbols, so a page object only pulls in the fixtures that actually
# drive it. Any doubt on its side answers ALL.
#
# macOS runs the whole selection on its one runner. Windows runs the same selection
# split across shards — this job resolves the scope and the Windows leg plans the split
# from it, with the same tool, the same way every other origin of that leg does.
#
# Baselines are excluded — they are visual-suite inputs and cannot change an
# InWorld result.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'explorer/Tests/**'
      - '!explorer/Tests/Baselines/**'
      - 'explorer/ci/**'
      - '.github/workflows/inworld-pr.yml'
      - '.github/workflows/run-inworld-suite.yml'
      - '.github/workflows/windows-inworld-custom-image.yml'
      - '.github/actions/setup-explorer-runner/**'

# Scoped to the PR branch: a new commit supersedes the run in flight. With one
# macOS runner, stale runs would otherwise queue ahead of the current code.
concurrency:
  group: inworld-pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  # Must be a superset of run-inworld-suite.yml's, or the call dies at startup.
  contents: read
  pull-requests: write

jobs:
  resolve:
    name: Resolve test scope
    # Drafts skip CI. Fork PRs get no secrets, so the suite could only fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
      filter: ${{ steps.scope.outputs.filter }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v6

      # No global.json in the repo, so the SDK the scope tool builds under is
      # pinned here rather than inherited from the runner image.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # ~800 MB of packages for a job that only reads symbols; a cold restore is
      # most of this job's wall clock. No packages.lock.json, so setup-dotnet's
      # own cache option is unavailable.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('explorer/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # ScopeInWorldTests opens Tests.csproj through MSBuildWorkspace, which needs
      # the NuGet references resolved on disk or every symbol lookup comes back null.
      - name: Restore test project
        run: dotnet restore explorer/Tests/Tests.csproj

      # The closure is only worth trusting while these hold. A drift forces the
      # broad path below instead of blocking the PR.
      - name: Verify scope resolver against golden closures
        id: golden
        continue-on-error: true
        run: |
          set -euo pipefail
          dotnet build explorer/ci/ScopeInWorldTests -c Release --nologo -v quiet
          dotnet explorer/ci/ScopeInWorldTests/bin/Release/net10.0/ScopeInWorldTests.dll --self-test

      - name: Classify changed files
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GOLDEN: ${{ steps.golden.outcome }}
        run: |
          set -euo pipefail
          SCOPE_DLL=explorer/ci/ScopeInWorldTests/bin/Release/net10.0/ScopeInWorldTests.dll

          CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename')
          echo "::group::Changed files"
          echo "$CHANGED"
          echo "::endgroup::"

          # None of this is symbol-reachable, so the closure below cannot see it and
          # must not be trusted with it. GlobalSetup is the sharpest case: it is an
          # assembly-level [SetUpFixture] that no fixture references by symbol, so
          # letting the graph classify a change there would produce a false green.
          BROAD='^(\.github/workflows/|\.github/actions/|explorer/ci/|explorer/Tests/GlobalSetup\.cs$|explorer/Tests/GlobalUsings\.cs$|explorer/Tests/Tests\.csproj$)'

          # The resolver prints ALL on any doubt of its own; `|| echo ALL` covers a crash
          # that kills it before it can, and a failed golden check demotes the answer to
          # ALL as well.
          SCOPE=ALL
          if printf '%s\n' "$CHANGED" | grep -Eq "$BROAD"; then
            echo "::notice::CI or non-reachable test infrastructure changed — running the whole InWorld suite."
          elif [ "$GOLDEN" != 'success' ]; then
            echo "::warning::Golden closure check did not pass — running the whole InWorld suite."
          else
            SCOPE=$(printf '%s\n' "$CHANGED" \
              | dotnet "$SCOPE_DLL" 2> "$RUNNER_TEMP/scope.log" \
              || echo ALL)
            SCOPE=$(printf '%s' "$SCOPE" | tail -n 1)
          fi

          if [ -f "$RUNNER_TEMP/scope.log" ]; then
            # Indented code block, not a fence: a path holding a backtick run cannot
            # break out of it and inject markdown into the summary.
            {
              echo '### InWorld scope'
              echo
              sed 's/^/    /' "$RUNNER_TEMP/scope.log"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          FILTER=""
          case "$SCOPE" in
            NONE)
              echo "::notice::No InWorld fixture reaches the changed files — nothing to run."
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            # Class-name match: the category lives on the class, so a fixture is
            # wholly in or out and there is no need to AND the category back in.
            FIXTURES:*)
              for c in ${SCOPE#FIXTURES:}; do
                # Interpolated into the vstest filter, so anything that is not a
                # class name means the resolver is not doing what we think it is.
                if ! printf '%s' "$c" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
                  echo "::warning::Resolver returned '$c', which is not a class name — running the whole InWorld suite."
                  FILTER=""
                  break
                fi
                [ -n "$FILTER" ] && FILTER="${FILTER}|"
                FILTER="${FILTER}FullyQualifiedName~${c}"
              done
              ;;
            ALL) ;;
            *)
              echo "::warning::Resolver printed '$SCOPE' — running the whole InWorld suite."
              ;;
          esac

          # Every branch above that widens FILTER past what the resolver selected has to widen
          # the scope with it, or the Windows leg would split a narrower selection than the one
          # macOS runs. Both are derived here, from the same answer, so they cannot disagree.
          if [ -z "$FILTER" ]; then
            echo "::notice::Running the whole InWorld suite."
            FILTER='Category=InWorld'
            SCOPE='ALL'
          else
            echo "::notice::Affected InWorld fixtures:${SCOPE#FIXTURES:}"
          fi

          {
            echo "should_run=true"
            echo "filter=${FILTER}"
            echo "scope=${SCOPE}"
          } >> "$GITHUB_OUTPUT"

  # One caller job on purpose: GitHub keys the run's fold on it, so both legs and
  # the results table stay under a single "InWorld suite" heading.
  run-suite:
    name: InWorld suite
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    uses: ./.github/workflows/run-inworld-suite.yml
    with:
      # Empty build_url makes the reusable resolve the newest unity-explorer
      # dev build. That must stay a branch build: release zips are compiled
      # without the AltTester scripting define and hang at "Wait for
      # connection: 0%".
      build_url: ''
      filter: ${{ needs.resolve.outputs.filter }}
      # What Windows splits. The filter says the same thing in vstest's vocabulary, but nothing
      # maps one back to the fixtures the packer weighs, so the scope travels as itself.
      scope: ${{ needs.resolve.outputs.scope }}
      pr_number: ${{ github.event.pull_request.number }}
      tests_ref: ${{ github.head_ref }}
      # Empty keeps the established org Catalyst path. Set the repository variable
      # after the published fixture and Windows runner have passed the manual proof.
      fixture_image: ${{ vars.E2E_CATALYST_IMAGE || '' }}
      fixture_ref: ${{ vars.E2E_CATALYST_REF || 'main' }}
    secrets: inherit
