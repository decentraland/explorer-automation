name: InWorld (PR)

# Runs the InWorld suite on PRs, scoped to what the PR actually touches:
#
#   changed InWorld fixtures only  -> just those fixtures
#   CI or shared test infra changed -> the whole Category=InWorld suite
#
# "Shared" means anything a single fixture cannot be reasoned about without:
# the workflows and the runner chassis, explorer/ci/*, BaseTest, GlobalSetup,
# the csproj, and Common/ + Views/ (page objects every fixture drives through).
#
# Baselines are excluded — they are visual-suite inputs and cannot change an
# InWorld result.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'explorer/Tests/**'
      - '!explorer/Tests/Baselines/**'
      - 'explorer/ci/**'
      - '.github/workflows/inworld-pr.yml'
      - '.github/workflows/run-inworld-suite.yml'
      - '.github/actions/setup-explorer-runner/**'

# Scoped to the PR branch: a new commit supersedes the run in flight. With one
# macOS runner, stale runs would otherwise queue ahead of the current code.
concurrency:
  group: inworld-pr-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  # Must be a superset of run-inworld-suite.yml's, or the call dies at startup.
  contents: read
  pull-requests: write

jobs:
  resolve:
    name: Resolve test scope
    # Drafts skip CI. Fork PRs get no secrets, so the suite could only fail.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
      filter: ${{ steps.scope.outputs.filter }}
    steps:
      - uses: actions/checkout@v6

      - name: Classify changed files
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --paginate --jq '.[].filename')
          echo "::group::Changed files"
          echo "$CHANGED"
          echo "::endgroup::"

          # Anything here can change the outcome of any fixture, so scoping
          # down would give a green tick that means nothing.
          BROAD='^(\.github/workflows/|\.github/actions/|explorer/ci/|explorer/Tests/Common/|explorer/Tests/Views/|explorer/Tests/GlobalSetup\.cs$|explorer/Tests/GlobalUsings\.cs$|explorer/Tests/Tests\.csproj$|explorer/Tests/Tests/BaseTest\.cs$|explorer/Tests/Tests/LoggedOutAuthBaseTest\.cs$)'
          if printf '%s\n' "$CHANGED" | grep -Eq "$BROAD"; then
            echo "::notice::CI or shared test infrastructure changed — running the whole InWorld suite."
            {
              echo "should_run=true"
              echo "filter=Category=InWorld"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise: only the fixtures that changed AND carry the category.
          # Reading the category off the checked-out file rather than a hard
          # coded list means a fixture joining or leaving Category=InWorld
          # needs no edit here.
          CLASSES=""
          while IFS= read -r f; do
            case "$f" in explorer/Tests/Tests/*.cs) ;; *) continue ;; esac
            [ -f "$f" ] || continue                       # deleted by this PR
            grep -q 'Category("InWorld")' "$f" || continue
            CLASSES="${CLASSES} $(basename "$f" .cs)"
          done <<< "$CHANGED"

          if [ -z "$CLASSES" ]; then
            echo "::notice::No InWorld fixtures changed — nothing to run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Class-name match: the category lives on the class, so a fixture is
          # wholly in or out and there is no need to AND the category back in.
          FILTER=""
          for c in $CLASSES; do
            [ -n "$FILTER" ] && FILTER="${FILTER}|"
            FILTER="${FILTER}FullyQualifiedName~${c}"
          done
          echo "::notice::Changed InWorld fixtures:${CLASSES}"
          {
            echo "should_run=true"
            echo "filter=${FILTER}"
          } >> "$GITHUB_OUTPUT"

  run-suite:
    name: InWorld suite
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    uses: ./.github/workflows/run-inworld-suite.yml
    with:
      # Empty build_url makes the reusable resolve the newest unity-explorer
      # dev build. That must stay a branch build: release zips are compiled
      # without the AltTester scripting define and hang at "Wait for
      # connection: 0%".
      build_url: ''
      filter: ${{ needs.resolve.outputs.filter }}
      pr_number: ${{ github.event.pull_request.number }}
      tests_ref: ${{ github.head_ref }}
    secrets: inherit
