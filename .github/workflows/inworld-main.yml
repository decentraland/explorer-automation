name: InWorld (main)

# Runs the whole Category=InWorld suite and the Visual suite after every merge to main.
#
# PR runs are scoped by Roslyn reachability (inworld-pr.yml), so a merge commit
# is the first time the whole suite sees the merged state. It is also what makes
# the "land incidental primitive changes on main first" practice in
# explorer/CLAUDE.md safe: the narrow PR run is backed by a wide one here.
#
# All the mechanics live in run-inworld-suite.yml, which runs macOS and Windows and
# tabulates both. There is no PR to comment on, so the table lands in the job summary
# alongside the Allure report link. The Windows leg splits the category across shards
# here exactly as it does on a PR.
#
# The Visual suite (run-visual-suite.yml) runs beside it against the same dev build
# rule. Baselines and explorer/scenes/ are visual-only inputs: a push touching nothing
# else runs the Visual suite alone.

on:
  push:
    branches: [main]
    # Same inputs as inworld-pr.yml.
    paths:
      - 'explorer/Tests/**'
      - 'explorer/scenes/**'
      - 'explorer/ci/**'
      - '.github/workflows/inworld-main.yml'
      - '.github/workflows/run-inworld-suite.yml'
      - '.github/workflows/run-visual-suite.yml'
      - '.github/workflows/windows-inworld-custom-image.yml'
      - '.github/actions/setup-explorer-runner/**'

# A newer main supersedes the run in flight: the question this suite answers is
# whether main is good now, and the newest commit contains the older one.
concurrency:
  group: inworld-main
  cancel-in-progress: true

permissions:
  # Must be a superset of run-inworld-suite.yml's, or the call dies at startup.
  contents: read
  pull-requests: write
  id-token: write

jobs:
  resolve:
    name: Classify the push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      inworld_should_run: ${{ steps.classify.outputs.inworld_should_run }}
      short_sha: ${{ steps.classify.outputs.short_sha }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "short_sha=${AFTER::7}" >> "$GITHUB_OUTPUT"
          # Visual-only inputs cannot change an InWorld result. Anything else, or a
          # diff the API cannot produce, runs the whole suite.
          CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${AFTER}" \
            --paginate --jq '.files[].filename' 2>/dev/null || echo '<unknown>')
          echo "::group::Changed files"
          echo "$CHANGED"
          echo "::endgroup::"
          if printf '%s\n' "$CHANGED" | grep -Evq '^explorer/(Tests/Baselines|scenes)/'; then
            echo "inworld_should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Only visual-suite inputs changed — skipping the InWorld suite."
            echo "inworld_should_run=false" >> "$GITHUB_OUTPUT"
          fi

  run-suite:
    name: InWorld suite
    needs: resolve
    if: needs.resolve.outputs.inworld_should_run == 'true'
    uses: ./.github/workflows/run-inworld-suite.yml
    with:
      # Empty build_url makes the reusable resolve the newest unity-explorer
      # dev build. That must stay a branch build: release zips are compiled
      # without the AltTester scripting define and hang at "Wait for
      # connection: 0%".
      build_url: ''
      # Empty filter is the whole suite. Every other input is left empty on
      # purpose — for a same-repo push the reusable resolves tests_ref,
      # commit_sha and branch_label from github.sha / github.ref_name, and an
      # empty pr_number keeps it summary-only.
      filter: ''
      # Nothing resolves a scope on main, so it is stated: the whole category. The
      # Windows leg splits it with the same tool, into the same number of shards,
      # as it splits a PR's narrower scope.
      scope: 'ALL'
      # E2E_FIXTURE_PROVISION is the single opt-in. Everything else stays neutral
      # while it is off: the reusable also treats fixture_mode == 'external' as a
      # request to provision, so forwarding the org variable unconditionally would
      # route every ordinary PR through the fixture. The legacy local image is only
      # passed when local mode is explicitly selected; hosted GPU runners cannot
      # provide nested Docker.
      provision_fixture: ${{ vars.E2E_FIXTURE_PROVISION == 'true' }}
      fixture_mode: ${{ vars.E2E_FIXTURE_PROVISION == 'true' && (vars.E2E_FIXTURE_MODE || 'org') || 'org' }}
      fixture_base_url: ${{ vars.E2E_FIXTURE_PROVISION == 'true' && (vars.E2E_FIXTURE_BASE_URL || '') || '' }}
      fixture_base_domain: ${{ vars.E2E_FIXTURE_PROVISION == 'true' && (vars.E2E_FIXTURE_BASE_DOMAIN || '') || '' }}
      fixture_manager_role_arn: ${{ vars.E2E_FIXTURE_MANAGER_ROLE_ARN || '' }}
      fixture_manager_function: ${{ vars.E2E_FIXTURE_MANAGER_FUNCTION_NAME || '' }}
      fixture_manager_region: ${{ vars.E2E_FIXTURE_MANAGER_AWS_REGION || 'us-east-1' }}
      fixture_manager_profile: ${{ vars.E2E_FIXTURE_PROFILE || 'core-v1' }}
      fixture_manager_ttl_minutes: ${{ vars.E2E_FIXTURE_TTL_MINUTES || '90' }}
      fixture_seed_version: ${{ vars.E2E_FIXTURE_SEED_VERSION || 'avatar-assets' }}
      fixture_image: ${{ vars.E2E_FIXTURE_PROVISION == 'true' && (vars.E2E_FIXTURE_MODE || 'org') == 'local' && (vars.E2E_CATALYST_IMAGE || '') || '' }}
      fixture_ref: ${{ vars.E2E_CATALYST_REF || 'main' }}
    secrets: inherit

  visual-suite:
    name: Visual suite
    needs: resolve
    uses: ./.github/workflows/run-visual-suite.yml
    # Must be a superset of run-visual-suite.yml's, or the call dies at startup.
    permissions:
      contents: write
      pull-requests: write
    with:
      mode: test
      # Empty build_url resolves the newest unity-explorer dev build, as above.
      build_url: ''
      tests_ref: ${{ github.ref_name }}
      commit_sha: ${{ needs.resolve.outputs.short_sha }}
      branch_label: ${{ github.ref_name }}
    secrets: inherit
