name: Visual Suite

# Reusable workflow that owns the actual mechanics of running the visual
# regression suite: prereq install, AltTester license, Explorer install,
# metaforge test run, Allure report upload, optional baseline commit, and
# optional PR comment.
#
# Three callers:
#   - decentraland/unity-explorer    → /visual-tests on a PR (mode: test)
#   - decentraland/explorer-automation → /generate-baselines on a PR (mode: record, auto-commits)
#   - decentraland/explorer-automation → manual workflow_dispatch (mode: test or record, no commit)
#
# Keeping the logic in one place avoids the callers drifting and means
# every fix lands in one file. macOS-only because AltTester needs a real
# GPU and visual baselines are pinned to one OS to avoid pixel-diff churn
# across platforms.
#
# Required secrets (caller passes via `secrets: inherit`):
#   - ALTTESTER_LICENSE                        AltTester Pro license key
#   - REPOS_READ_ONLY_TOKEN                    PAT — read on decentraland/MetaForge + decentraland/unity-explorer (read-only is sufficient; baseline auto-commits use GITHUB_TOKEN)
#
# The S3 upload credentials come in two org-level families, each granted to a
# different repo and pointing at a different bucket. `secrets: inherit` passes
# only what the caller was actually granted, and an ungranted secret resolves
# to an empty string rather than erroring — so this workflow selects the family
# by caller repo instead of hardcoding one. Verified 2026-08-07 against the
# actions/organization-secrets and actions/organization-variables APIs:
#
#   caller repo                       secret family        bucket public URL
#   decentraland/unity-explorer       EXPLORER_TEAM_*      explorer-artifacts.decentraland.org
#   decentraland/explorer-automation  DEV_EXPLORER_TEAM_*  explorer-artifacts.decentraland.zone
#
# Each family carries S3_BUCKET, AWS_DEFAULT_REGION, AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY.
#
# Required vars on the caller's repo (read via `vars.*` inside this workflow,
# which resolves against the caller's repo for workflow_call invocations):
#   - <family>_S3_BUCKET_PUBLIC_URL  Public-facing prefix of the bucket
#
# Both *_S3_BUCKET_PUBLIC_URL vars are granted to both repos, so the var has to
# be picked from the same family as the bucket secret — mixing them uploads to
# one bucket and links to the other, and the report link 404s.

on:
  workflow_call:
    inputs:
      platform:
        description: 'Target OS for the run. "macos" today; "windows" wired in but the install steps don''t exist yet — leave as macos until the Windows runner is provisioned.'
        type: string
        required: false
        default: macos

      mode:
        description: '"test" to validate against baselines (default), "record" to regenerate them, or "bootstrap" to only record baselines that are currently missing.'
        type: string
        required: false
        default: test

      filter:
        description: 'NUnit filter expression passed to `mf explorer test --filter`. Empty falls back to "Category=Visual" (run the whole visual suite).'
        type: string
        required: false
        default: ''

      pr_number:
        description: 'PR number on the *caller* repo, used for the S3 path and the result comment. Leave empty for non-PR runs (e.g. manual dispatch); the result then surfaces only in the workflow summary.'
        type: string
        required: false
        default: ''

      build_url:
        description: 'Direct URL to a Decentraland_macos.zip Explorer build. Bypasses per-SHA resolution.'
        type: string
        required: true

      tests_ref:
        description: 'explorer-automation branch to use for tests/scenes/baselines. Empty falls back to main.'
        type: string
        required: false
        default: ''

      commit_sha:
        description: 'Short SHA of the caller PR head, surfaced in the PR comment + S3 path. Defaults to the workflow run id when omitted (e.g. manual dispatch with no commit under test).'
        type: string
        required: false
        default: ''

      branch_label:
        description: 'Branch name shown in the PR comment. Defaults to the tests_ref when omitted.'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    name: Visual suite (${{ inputs.mode }} / ${{ inputs.platform }})
    runs-on: ${{ inputs.platform == 'windows' && 'windows-latest' || 'macos-14' }}
    timeout-minutes: 30

    env:
      TARGET_OS: ${{ inputs.platform }}
      MODE: ${{ inputs.mode }}
      PR_NUMBER: ${{ inputs.pr_number }}
      # github.repository inside a workflow_call run resolves to the caller's repo
      PR_REPO: ${{ github.repository }}
      BUILD_URL: ${{ inputs.build_url }}
      TESTS_REF: ${{ inputs.tests_ref }}
      # commit_sha/branch_label are cosmetic => fall back to workflow run id
      # and tests_ref (or "main") when callers omit them (e.g. manual dispatch)
      COMMIT_SHA: ${{ inputs.commit_sha != '' && inputs.commit_sha || format('run-{0}', github.run_id) }}
      BRANCH_LABEL: ${{ inputs.branch_label != '' && inputs.branch_label || (inputs.tests_ref != '' && inputs.tests_ref || 'main') }}
      # Filter passed to `mf explorer test --filter`. Defaults to the whole visual suite when caller doesnt supply one
      TEST_FILTER: ${{ inputs.filter != '' && inputs.filter || 'Category=Visual' }}
      # vars.* inside a workflow_call run reads the *caller's* repo vars. Kept
      # in lockstep with the bucket secret selected below — see header.
      PUBLIC_URL_PREFIX: ${{ github.repository == 'decentraland/explorer-automation' && vars.DEV_EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL || vars.EXPLORER_TEAM_S3_BUCKET_PUBLIC_URL }}

    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          case "$MODE" in
            test|record|bootstrap) ;;
            *) echo "::error::Unknown mode '$MODE'. Expected 'test', 'record', or 'bootstrap'."; exit 1 ;;
          esac
          case "$TARGET_OS" in
            macos) ;;
            windows)
              echo "::error::platform=windows is not yet supported — the install steps in this workflow are macOS-only (hdiutil/dmg, /Applications, brew). Re-run with platform=macos."
              exit 1
              ;;
            *) echo "::error::Unknown platform '$TARGET_OS'. Expected 'macos' or 'windows'."; exit 1 ;;
          esac

          for v_name in TESTS_REF BRANCH_LABEL; do
            v_val="${!v_name}"
            if [ -z "$v_val" ]; then continue; fi
            if ! printf '%s' "$v_val" | grep -Eq '^[A-Za-z0-9._/-]+$' \
               || [ "${v_val#-}" != "$v_val" ]; then
              echo "::error::$v_name='$v_val' contains characters that are not allowed. Allowed: A-Z a-z 0-9 . _ / -, and must not start with '-'."
              exit 1
            fi
          done

          case "$BUILD_URL" in
            https://explorer-artifacts.decentraland.org/*|https://explorer-artifacts.decentraland.zone/*|https://github.com/decentraland/*|https://objects.githubusercontent.com/*) ;;
            *)
              echo "::error::BUILD_URL='$BUILD_URL' is not from a trusted host (decentraland artifact bucket or GitHub release)."
              exit 1
              ;;
          esac

      - name: Compute identifiers
        id: ids
        run: |
          set -euo pipefail
          # S3 path is namespaced by caller repo so unity-explorer and
          # explorer-automation reports never collide. For non-PR runs
          # (manual dispatch) PR_NUMBER is empty — bucket those under a
          # `manual/` segment plus the workflow run id so successive
          # manual dispatches don't overwrite each other's reports.
          # TARGET_OS segment lets parallel macOS + Windows runs
          # write to separate paths without clobbering each other.
          REPO_SLUG="${PR_REPO//\//-}"
          PR_SEGMENT="${PR_NUMBER:-manual-${GITHUB_RUN_ID}}"
          S3_PATH="@dcl/${REPO_SLUG}/visual-regression/${MODE}/${TARGET_OS}/${PR_SEGMENT}/${COMMIT_SHA}"
          {
            echo "s3_path=${S3_PATH}"
            echo "report_url=${PUBLIC_URL_PREFIX}/${S3_PATH}/index.html"
          } >> "$GITHUB_OUTPUT"

      # dotnet + AltTester + allure + MetaForge + license, shared with
      # run-inworld-suite.yml. `uses: ./…` resolves against $GITHUB_WORKSPACE,
      # so the action has to be on disk first:
      #   `repository:` — a bare checkout in a workflow_call run fetches the
      #     CALLER's repo, which has no such action.
      #   `path:` — this job needs an empty workspace. `mf explorer test`
      #     switches to cwd-mode when the workspace is an explorer-automation
      #     checkout; here it must keep using MetaForge's managed clone, which
      #     is what `--tests-ref` and the baseline commit rely on. The cleanup
      #     step below restores the empty workspace.
      #   `ref:` — tracks this repo, not `tests_ref`: the chassis is workflow
      #     infrastructure, and an old tests_ref must not fail the run on a
      #     missing action.yml.
      - name: Fetch runner chassis action
        uses: actions/checkout@v6
        with:
          repository: decentraland/explorer-automation
          ref: ${{ github.repository == 'decentraland/explorer-automation' && github.sha || 'main' }}
          path: .chassis
          sparse-checkout: .github/actions

      - name: Set up Explorer test runner
        uses: ./.chassis/.github/actions/setup-explorer-runner
        with:
          github-token: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
          alttester-license: ${{ secrets.ALTTESTER_LICENSE }}

      # Everything the action installed lives outside the workspace (~/.dotnet,
      # /Applications, $GITHUB_PATH), so dropping the checkout is safe and
      # restores the empty workspace later steps assume.
      - name: Drop the chassis checkout
        run: rm -rf "${GITHUB_WORKSPACE:?}/.chassis"

      - name: Pre-install Explorer build
        env:
          GH_TOKEN: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
        # `mf account login` writes auth-token state into Explorer's userdata
        # dir, which only exists after Explorer has been installed at least
        # once. Pre-install up front so login doesn't trip on a missing path.
        # `mf explorer install` is idempotent; the later `mf explorer test`
        # call finds the build already cached.
        run: mf explorer install "${BUILD_URL}" --non-interactive

      - name: Provision metaforge test account
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Application Support/Decentraland/Explorer"
          ACCOUNT="ci-visual-${GITHUB_RUN_ID}"
          mf account create "$ACCOUNT"
          mf account login "$ACCOUNT"
          echo "MF_ACCOUNT=${ACCOUNT}" >> "$GITHUB_ENV"

      - name: Run visual regression suite
        env:
          MF_LOG_LEVEL: info
          GH_TOKEN: ${{ secrets.REPOS_READ_ONLY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${TESTS_REF:-}" ]; then
            mf explorer server start --tests-ref "${TESTS_REF}"
          else
            mf explorer server start
          fi

          RECORD_FLAG=""
          case "$MODE" in
            record)    RECORD_FLAG="--record-baselines" ;;
            bootstrap) export SNAPSHOT_MODE=MissingOnly ;;
          esac

          # --report-type None: report generation is ours now, in the step
          # below. metaforge's ReportType offers only LocalServer (generates,
          # then blocks serving a browser — unusable here), SingleFile, and
          # None. SingleFile inlines every attachment as base64 into one HTML
          # and a large run overruns allure's size cap ("The report is too large
          # to be generated in the single file mode!"), taking the whole publish
          # chain down with it. None also subsumes --skip-allure-open: nothing
          # is generated, so there is nothing to open.
          TEST_EXIT=0
          mf explorer test "${BUILD_URL}" \
            --non-interactive \
            ${TESTS_REF:+--tests-ref "$TESTS_REF"} \
            $RECORD_FLAG \
            --filter "$TEST_FILTER" \
            --report-type None \
            || TEST_EXIT=$?

          mf explorer server stop --non-interactive || true
          exit "$TEST_EXIT"

      # The generation metaforge used to do, minus `--single-file`. Writing to
      # the same directory metaforge used keeps the rest of the publish chain
      # untouched: the locate step below still finds index.html, and `aws s3
      # sync` was already syncing a directory, so a multi-file report uploads
      # and serves from S3 unchanged.
      #
      # `always()`: a failed run is exactly when the report matters most.
      - name: Generate Allure report
        if: always()
        run: |
          set -euo pipefail
          MF_DATA="$HOME/Library/Application Support/Decentraland/MetaForge"
          REPORT_DIR="$MF_DATA/allure-report"

          # This suite keeps an empty workspace on purpose so `mf explorer test`
          # stays on metaforge's managed clone rather than switching to cwd-mode
          # (see the chassis checkout above), so results land under that clone's
          # build output. run-inworld-suite.yml is checked out in the workspace
          # and therefore resolves a different path in its copy of this step.
          # Don't unify them.
          RESULTS="$MF_DATA/explorer-automation/explorer/Tests/bin/Debug/net10.0/allure-results"
          if [ ! -d "$RESULTS" ]; then
            # -print -quit rather than `| head -1`: under `set -o pipefail` head
            # closes stdin after one line, find writes again and takes SIGPIPE,
            # and the pipeline returns non-zero.
            RESULTS=$(find "$MF_DATA" -type d -name allure-results \
                           -print -quit 2>/dev/null || true)
          fi

          # Gate on *-result.json, not on the directory being non-empty. If the
          # test host is killed mid-fixture, Allure.NUnit has already flushed
          # attachments and a *-container.json but no test result — and `allure
          # awesome` happily turns that into a valid report reading {"total":0} /
          # "passed". Publishing that would sail straight past the locate step's
          # hard failure below, which exists precisely so a run cannot ship a
          # green check with no real artifact.
          #
          # No results is a different failure from generation failing: nothing
          # ran, so there is nothing to generate. Leave the report absent and let
          # the locate step own the hard failure, so one place decides that a
          # missing report is fatal.
          if [ -z "$RESULTS" ] || \
             [ -z "$(find "$RESULTS" -maxdepth 1 -name '*-result.json' -print -quit 2>/dev/null)" ]; then
            echo "::warning::No Allure test results found — the run produced no *-result.json, so nothing reported before it stopped. Skipping report generation."
            exit 0
          fi

          # Stage into a scratch dir and swap it in only once allure has
          # succeeded. Two reasons, both verified against allure 3.14.3:
          #
          #   1. `allure awesome -o DIR` on a DIR that already holds a report
          #      writes the new one to DIR/awesome/ and leaves the old
          #      index.html byte-identical at the root. The locate step below
          #      reads the root, so it would publish the STALE report under this
          #      run's URL with no warning. metaforge guarded against this by
          #      deleting the report dir first. Harmless on an ephemeral runner
          #      where the dir starts absent; live on a persistent self-hosted
          #      runner and when running these steps locally.
          #   2. allure copies every attachment into the tree, so a failure
          #      partway through (ENOSPC being the realistic one) can leave a
          #      valid-looking index.html beside incomplete data/ and widgets/.
          #      Staging means index.html appears at the canonical path only when
          #      the whole report is there.
          #
          # Sibling of the destination, so the mv is a same-filesystem rename.
          #
          # Clear the destination BEFORE generating, not after. A previous run's
          # report has no value here, and if generation then fails, `set -e`
          # aborts before the mv and leaves nothing behind — so the locate step
          # hard-fails as it should rather than republishing run N's report under
          # run N+1's URL behind a green [Open] link.
          STAGE="${REPORT_DIR}.staging"
          rm -rf "$STAGE" "$REPORT_DIR"
          echo "Generating report from: $RESULTS"
          allure awesome "$RESULTS" -o "$STAGE"
          mv "$STAGE" "$REPORT_DIR"

      - name: Locate Allure report
        id: report
        if: always()
        run: |
          set -euo pipefail
          # An exact path check, not a search. metaforge runs with
          # --report-type None, so the generate step above is the only thing that
          # writes a report under the data dir, and it stages the tree and swaps
          # it in atomically — index.html sitting here means a complete report.
          # Searching would only add ways to pick the wrong index.html.
          REPORT_DIR="$HOME/Library/Application Support/Decentraland/MetaForge/allure-report"
          if [ ! -f "$REPORT_DIR/index.html" ]; then
            # Hard fail: the report is the user-visible evidence of the run.
            # Missing it means we can't show pass/fail diffs to reviewers,
            # which defeats the point of the pipeline. Better to fail loudly
            # than ship a green check with no artifact.
            echo "::error::Allure report not found. The generate step above either found no results or failed — check its log."
            exit 1
          fi
          echo "Report at: $REPORT_DIR/index.html"
          # report_dir is what actually gets published — the report is a
          # directory of files now, not one self-contained HTML.
          {
            echo "report_path=${REPORT_DIR}/index.html"
            echo "report_dir=${REPORT_DIR}"
          } >> "$GITHUB_OUTPUT"

      # An ungranted secret arrives as an empty string, so a family mismatch
      # otherwise surfaces as an opaque "Input required and not supplied:
      # aws-region" or `Invalid bucket name ""` from inside the AWS steps,
      # after a full green test run. Fail here naming what's actually missing.
      - name: Verify S3 configuration
        if: always() && steps.report.outputs.report_path != ''
        env:
          BUCKET: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_S3_BUCKET || secrets.EXPLORER_TEAM_S3_BUCKET }}
          REGION: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_DEFAULT_REGION || secrets.EXPLORER_TEAM_AWS_DEFAULT_REGION }}
          ACCESS_KEY_ID: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_ACCESS_KEY_ID || secrets.EXPLORER_TEAM_AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY || secrets.EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ "$PR_REPO" = 'decentraland/explorer-automation' ]; then
            FAMILY='DEV_EXPLORER_TEAM_'
          else
            FAMILY='EXPLORER_TEAM_'
          fi

          MISSING=""
          for entry in "S3_BUCKET:${BUCKET:-}" \
                       "AWS_DEFAULT_REGION:${REGION:-}" \
                       "AWS_ACCESS_KEY_ID:${ACCESS_KEY_ID:-}" \
                       "AWS_SECRET_ACCESS_KEY:${SECRET_ACCESS_KEY:-}"; do
            if [ -z "${entry#*:}" ]; then
              MISSING="${MISSING} secrets.${FAMILY}${entry%%:*}"
            fi
          done
          if [ -z "${PUBLIC_URL_PREFIX:-}" ]; then
            MISSING="${MISSING} vars.${FAMILY}S3_BUCKET_PUBLIC_URL"
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Caller ${PR_REPO} resolved an empty S3 config:${MISSING}. Those entries must be granted to that repo at the org level and reach this workflow via \`secrets: inherit\`."
            exit 1
          fi

      - name: Configure AWS credentials
        if: always() && steps.report.outputs.report_path != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_ACCESS_KEY_ID || secrets.EXPLORER_TEAM_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY || secrets.EXPLORER_TEAM_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_AWS_DEFAULT_REGION || secrets.EXPLORER_TEAM_AWS_DEFAULT_REGION }}

      - name: Upload Allure report to S3
        id: s3
        if: always() && steps.report.outputs.report_path != ''
        env:
          BUCKET: ${{ github.repository == 'decentraland/explorer-automation' && secrets.DEV_EXPLORER_TEAM_S3_BUCKET || secrets.EXPLORER_TEAM_S3_BUCKET }}
          S3_PATH: ${{ steps.ids.outputs.s3_path }}
          REPORT_DIR: ${{ steps.report.outputs.report_dir }}
        run: |
          set -euo pipefail
          aws s3 sync "$REPORT_DIR" "s3://$BUCKET/$S3_PATH/" \
            --acl public-read \
            --cache-control "public, max-age=300"

      - name: Upload Allure artifact (fallback if S3 fails)
        if: always() && steps.report.outputs.report_dir != ''
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-${{ inputs.mode }}-${{ env.COMMIT_SHA }}
          # The directory, not report_path: a multi-file report's index.html is
          # a shell that fetches widgets/*.json and data/* at runtime, so
          # uploading the single file alone yields an artifact that renders
          # nothing.
          #
          # Those fetches also mean the downloaded report needs an HTTP origin —
          # opening index.html straight off disk shows an empty report, because
          # browsers block fetch() over file://. Serve the unzipped directory
          # (`python3 -m http.server`) or just use the S3 link, which is the
          # primary path. The single-file report this replaces did open from
          # disk; that convenience is the trade for staying under allure's size
          # cap.
          path: ${{ steps.report.outputs.report_dir }}
          retention-days: 14

      # ─── Baselines mode: commit regenerated PNGs back to the PR branch ───
      # Fires when:
      #   1. mode is `record` or `bootstrap` (we asked for new baselines), AND
      #   2. PR_NUMBER is non-empty (a PR exists to push to). Manual
      #      workflow_dispatch in record mode renders new baselines you
      #      can inspect via the Allure report, but never commits — there
      #      is no "right" branch to push to without PR context, and an
      #      accidental push to main / dev would be destructive.
      # The caller's metaforge clone is already checked out at TESTS_REF,
      # so we commit from that working tree.
      #
      # Intentionally NOT gated on the report being present: the baselines
      # are the load-bearing artifact, the report is the user-visible
      # evidence. If `mf explorer test` recorded baselines but report-gen
      # failed afterward, we'd lose the baselines if we skipped this step,
      # forcing the user to re-run an expensive macOS-runner job.
      - name: Commit regenerated baselines
        if: always() && (inputs.mode == 'record' || inputs.mode == 'bootstrap') && env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO_ROOT="$HOME/Library/Application Support/Decentraland/MetaForge/explorer-automation"
          if [ ! -d "$REPO_ROOT/.git" ]; then
            echo "::warning::No managed clone of explorer-automation found at $REPO_ROOT; skipping baseline commit."
            exit 0
          fi

          cd "$REPO_ROOT"

          # createCommitOnBranch targets PR_REPO with a token scoped to PR_REPO, so both must
          # be this repo. Only explorer-automation runs record/bootstrap (caller table above);
          # fail loud rather than mis-target if that ever changes.
          if [ "$PR_REPO" != "decentraland/explorer-automation" ]; then
            echo "::error::Baseline auto-commit only supported from decentraland/explorer-automation, not '$PR_REPO'."
            exit 1
          fi

          git add '**/Baselines/**/*.png' || true
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi

          # Commit through the GraphQL API rather than `git push`: the repo's signed-commits
          # rule rejects the runner's unsigned push, and createCommitOnBranch commits are
          # signed by GitHub. Every payload piece reaches jq through a file (--rawfile /
          # --slurpfile), never argv, so the base64 (~8 MB across all baselines) can't hit ARG_MAX.
          git fetch --quiet origin "$TESTS_REF"
          EXPECTED_HEAD=$(git rev-parse FETCH_HEAD)

          ADD_ITEMS="$RUNNER_TEMP/additions.ndjson"
          : > "$ADD_ITEMS"
          git diff --cached --name-only --diff-filter=ACM | while IFS= read -r f; do
            base64 < "$f" | tr -d '\n' > "$RUNNER_TEMP/b64"
            jq -n --arg path "$f" --rawfile contents "$RUNNER_TEMP/b64" \
              '{path: $path, contents: $contents}' >> "$ADD_ITEMS"
          done
          jq -s '.' "$ADD_ITEMS" > "$RUNNER_TEMP/additions.json"
          git diff --cached --name-only --diff-filter=D \
            | jq -R 'select(length > 0) | {path: .}' | jq -s '.' > "$RUNNER_TEMP/deletions.json"

          BODY=$(printf 'Triggered by PR #%s on %s.\nRecorded against build %s.' \
            "$PR_NUMBER" "$PR_REPO" "$COMMIT_SHA")

          # --slurpfile wraps the file's JSON in an outer array, hence the [0] unwrap.
          jq -n \
            --arg repo "$PR_REPO" \
            --arg branch "$TESTS_REF" \
            --arg oid "$EXPECTED_HEAD" \
            --arg headline 'chore(baselines): regenerate via /generate-baselines' \
            --arg body "$BODY" \
            --slurpfile additions "$RUNNER_TEMP/additions.json" \
            --slurpfile deletions "$RUNNER_TEMP/deletions.json" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline, body: $body},
                fileChanges: {additions: $additions[0], deletions: $deletions[0]}}}}' \
            > "$RUNNER_TEMP/ccob.json"

          gh api graphql --input "$RUNNER_TEMP/ccob.json"
          echo "Committed regenerated baselines to ${TESTS_REF} (signed by GitHub)."

      - name: Find existing PR comment
        if: always() && env.PR_NUMBER != ''
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: find-comment
        with:
          repository: ${{ env.PR_REPO }}
          issue-number: ${{ env.PR_NUMBER }}
          comment-author: 'github-actions[bot]'
          body-includes: ${{ format('## {0} ({1})', (inputs.mode == 'record' || inputs.mode == 'bootstrap') && 'Baseline regeneration' || 'Visual regression tests', inputs.platform) }}

      - name: Comment results on PR
        if: always() && env.PR_NUMBER != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          repository: ${{ env.PR_REPO }}
          issue-number: ${{ env.PR_NUMBER }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## ${{ (inputs.mode == 'record' || inputs.mode == 'bootstrap') && 'Baseline regeneration' || 'Visual regression tests' }} (${{ inputs.platform }})

            ${{ job.status == 'success' && ((inputs.mode == 'record' || inputs.mode == 'bootstrap') && '✅ **Baselines regenerated.**' || '✅ **All visual tests passed.**') || ((inputs.mode == 'record' || inputs.mode == 'bootstrap') && '❌ **Baseline regeneration failed.**' || '❌ **Visual tests failed.**') }}

            | | |
            |---|---|
            | Platform | `${{ inputs.platform }}` |
            | Mode | `${{ inputs.mode }}` |
            | Commit | `${{ env.COMMIT_SHA }}` |
            | Branch | `${{ env.BRANCH_LABEL }}` |
            | Tests ref | `${{ env.TESTS_REF || 'main' }}` |
            | Filter | `${{ env.TEST_FILTER }}` |
            | Allure report | ${{ steps.s3.outcome == 'success' && format('[Open]({0})', steps.ids.outputs.report_url) || (steps.report.outputs.report_path != '' && '_generated but S3 upload failed — see workflow artifact_' || '_not generated_') }} |
            | Workflow run | [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            <sub>${{ (inputs.mode == 'record' || inputs.mode == 'bootstrap') && 'Triggered via `/generate-baselines`' || 'Triggered via `/visual-tests`' }} · this comment is updated on every run for this platform.</sub>

      # Upload the Explorer's Player.log so callers can download and print it
      - name: Upload Explorer Player.log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: player-log-${{ inputs.mode }}-${{ env.COMMIT_SHA }}
          path: /Users/runner/Library/Logs/Decentraland/Explorer/Player.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup metaforge state
        if: always()
        run: |
          mf explorer server stop --non-interactive || true
          mf alttester deactivate --non-interactive || true   # release the license activation slot
          if [ -n "${MF_ACCOUNT:-}" ]; then
            mf account remove "${MF_ACCOUNT}" --yes --non-interactive || true
          fi
